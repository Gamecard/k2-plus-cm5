# =====================================================================
# Dual-Z-Lichtschranken PA15/PA8 (Ersatz für Stock-[z_align]) – A10
# =====================================================================
# ENTWURF 17.10.2026 – am Gerät UNGETESTET. Doku + Testprotokoll:
# README.md §7.7. Alles mit ANNAHME ist nicht belegt.
#
# Stock (printer.cfg [z_align]): je eine
# Gabellichtschranke unten an jeder Z-Spindel, endstop_pin_z: PA15, PA8
# (Main-MCU). Die Creality-MCU fährt beide Z-Motoren selbst auf die
# Schranken (query_z_align), richtet das Bett so mechanisch aus und liefert
# die Z-max-Referenz; danach Z_TILT_ADJUST + G28 Z mit der Düse.
#
# ZWEI VARIANTEN – NIE beide gleichzeitig (jeder Pin darf in Upstream nur
# einmal belegt sein: "pin PA15 used multiple times in config",
# im Batch-Test geprüft):
#
#  L (AKTIV, Auslieferung): rein LESEND, reiner Upstream – [gcode_button]
#    (MCU-Befehle config_buttons/buttons_add/buttons_query/buttons_ack +
#    buttons_state stehen im Main-Dictionary, IDs 68-71/-22, Formate
#    identisch mit Upstream; Batch-Test EXIT 0). Kein eigenes Modul.
#    Meldung bei jedem Wechsel, QUERY_BUTTON / ZALIGN_STATUS jederzeit.
#
#  B (AUSKOMMENTIERT): [k2_zalign] (pi-host/k2_zalign.py) – Ausrichtung mit
#    Upstream-Homing-Mechanik (je Schranke ein Endstop, der genau EINEN
#    Z-Stepper stoppt), GESPERRT (allow_move: False + _PI_FREIGABE). Liest
#    ebenfalls (QUERY_ENDSTOPS zeigt zalign_z/zalign_z1, KTWO_ZALIGN_STATUS).
#    Aktivieren erst ab Testprotokoll-Schritt T4 (README.md §7.7):
#    k2_zalign.py nach ~/klipper/klippy/extras/ kopieren, Block L
#    auskommentieren, Block B einkommentieren, FIRMWARE_RESTART.
#
# Polarität/Pull-up: Stock zes_untrig: 1
# (printer.cfg:398) = Pegel 1 heißt "nicht ausgelöst" -> ausgelöst = 0 ->
# "!" ; die Stock-FW konfiguriert den Eingang mit gpio_in_setup(pin,
# zes_untrig=1) = Pull-up -> "^".
# ACHTUNG Creality-FW: pull_up=0 bedeutet dort Pull-DOWN (nicht floating
# wie Upstream) – "^" daher nicht weglassen.
# Zuordnung PA15 -> stepper_z, PA8 -> stepper_z1: belegt durch eine ältere
# Stock-F008-Config (endstop_pin_z: PA15,
# endstop_pin_z1: PA8). Welche Bettseite das physisch ist: ANNAHME
# stepper_z = links (z_positions -15,175) – am Gerät prüfen (T1).
# =====================================================================

# ---------------------------------------------------------------------
# Variante L – rein lesend (AKTIV)
# ---------------------------------------------------------------------
[gcode_button zalign_z]
# Lichtschranke stepper_z (Stock endstop_pin_z[0])
pin: ^!PA15
press_gcode:
  {action_respond_info("zalign_z (PA15): Lichtschranke AUSGELÖST")}
release_gcode:
  {action_respond_info("zalign_z (PA15): Lichtschranke frei")}

[gcode_button zalign_z1]
# Lichtschranke stepper_z1 (Stock endstop_pin_z[1])
pin: ^!PA8
press_gcode:
  {action_respond_info("zalign_z1 (PA8): Lichtschranke AUSGELÖST")}
release_gcode:
  {action_respond_info("zalign_z1 (PA8): Lichtschranke frei")}

# ---------------------------------------------------------------------
# Variante B – Ausrichtung (AUSKOMMENTIERT, und selbst dann GESPERRT)
# ---------------------------------------------------------------------
# Werte für den ERSTTEST bewusst unter Stock (Stock in Klammern,
# printer.cfg:386-399). Harte Grenzen im Modul: quick <= 30, slow <= 10,
# rising <= 20, safe <= 40, chunk <= safe_dist, max_travel <= 400 und
# <= Z-Bereich, timeout <= 300 s, retries <= 5.
#[k2_zalign]
#pin_z: ^!PA15
#pin_z1: ^!PA8
#stepper_z: stepper_z
#stepper_z1: stepper_z1
## GESPERRT bis Testprotokoll T5 (README.md §7.7)
#allow_move: False
## zusätzlich zur Laufzeit: SET_GCODE_VARIABLE MACRO=_PI_FREIGABE VARIABLE=allow_move VALUE=True
#freigabe_macro: _PI_FREIGABE
## nur nach Motor-Init (Event k2_motor:ready, KTWO_MOTOR_INIT/auto_init)
#require_motor_ready: True
## (Stock 30) mm/s abwärts Phase A
#quick_speed: 10
## (Stock 10) mm/s Phase C und LIFT
#slow_speed: 5
## (Stock 10) mm Hub nach dem ersten Auslösen
#rising_dist: 5
## (Stock 40) mm maximale Wegdifferenz der Seiten nach erstem Auslösen
#safe_dist: 5
## Etappenlänge (<= safe_dist); nach jeder Etappe Weg + Pegel geprüft
#chunk_dist: 2.5
## Gesamtweg Phase A (Z-Bereich -10..360 = 370)
#max_travel: 370
## Phase C: Budget rising_dist + slow_extra_dist
#slow_extra_dist: 3
## (Stock 5) Wiederholungen B+C
#retries: 3
## mm (Stock 10 Schritte, ~0,0125-0,025 mm, ANNAHME Einheit)
#retry_tolerance: 0.025
## s gesamt (Stock 30 s je Durchgang)
#timeout: 300
## 0 = Z danach NICHT referenziert (danach G28 Z). Stock setzt Z=360, die
## Düse liegt dann real bei ~352,2 (Mitschnitt real_zmax). Erst am Gerät
## messen (T6), dann ggf. konservativ kleiner setzen.
#zmax_position: 0

# ---------------------------------------------------------------------
# Hilfsmakros (für beide Varianten)
# ---------------------------------------------------------------------
[gcode_macro ZALIGN_STATUS]
description: Zeigt, ob die Z-Lichtschranken links und rechts ausgelöst sind (PA15/PA8, keine Bewegung)
gcode:
  {% if 'k2_zalign' in printer %}
    KTWO_ZALIGN_STATUS
  {% else %}
    QUERY_BUTTON BUTTON=zalign_z
    QUERY_BUTTON BUTTON=zalign_z1
  {% endif %}

[gcode_macro ZALIGN_STOCK]
description: Bett gerade stellen wie im Original: zuerst über die Z-Lichtschranken angleichen, dann Z-Tilt und neue Z-Referenz (vorher G28 X Y)
gcode:
  {% if 'k2_zalign' not in printer %}
    {action_raise_error("ZALIGN_STOCK: [k2_zalign] nicht geladen (zalign.cfg Variante B). Keine Bewegung.")}
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if 'x' not in homed or 'y' not in homed %}
    {action_raise_error("ZALIGN_STOCK braucht vorher G28 X Y (Antasten in Bettmitte). Keine Bewegung.")}
  {% endif %}
  # Stock gcode_macro.cfg:1010-1015 / 1217-1222: ZDOWN_SWITCH ENABLE=1 +
  # G28 Z (Lichtschranken), Z_TILT_ADJUST, NEXT_HOMEZ_NACCU + G28 Z.
  # Nur LIFT wird durchgereicht (DRY_RUN hier sinnlos: danach käme G28 Z).
  {% set lift = params.LIFT|default(0)|int %}
  KTWO_ZALIGN LIFT={1 if lift == 1 else 0}
  G28 Z
  Z_TILT_ADJUST
  G28 Z
