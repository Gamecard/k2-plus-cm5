# =====================================================================
# Homing K2 Plus (Ersatz für Stock-sensorless.cfg)
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET. Sensorless X/Y seit 16.10.2026
# spät (README.md §7.6): Stall-Mode über [k2_motor] KTWO_MOTOR_HOMING.
#
# Entscheidung: [homing_override] statt [safe_z_home] (beide zusammen
# verbietet Upstream). Gründe:
#  1. Stock-Reihenfolge Y -> X -> Z mit Freifahren nach jeder Achse
#     (sensorless.cfg _HOME_Y/_HOME_X: G1 Y+10 / X-10) braucht ein Makro.
#  2. Die Closed-loop-Motoren X/Y müssen VOR dem X/Y-Homing in Stall-Mode 1
#     (Stall-Ausgang = Endstop PB11/PB12) und danach zurück in Mode 2
#     (Notfall-Schutzausgang). Stock-Folge, live am Original-Drucker
#     beobachtet (16.10.2026):
#       vorher : 0x11 [01] an 0x81, 0x82; 0x06 ID 70 (pos_kp) = 300 an 0x81
#       nachher: 0x11 [02] an 0x81, 0x82; 0C [0b] an alle (E transparent);
#                0x06 ID 70 = 100 an 0x81
#     -> KTWO_MOTOR_HOMING PHASE=BEGIN / PHASE=END ([k2_motor]).
#  3. Zentrale Sperre: ohne Freigabe (_PI_FREIGABE allow_move) bricht G28
#     VOR jeder Bewegung ab; X/Y zusätzlich nur mit [k2_motor]
#     allow_write: True (sonst kann Stall-Mode 1 nicht gesetzt werden und
#     X/Y würde bis zur Blockade fahren, ohne dass PB11/PB12 auslösen).
# Z wird wie Stock in der Mitte des Mesh-Bereichs angetastet (175/175),
# Geschwindigkeit aus [stepper_z] homing_speed 5 / second_homing_speed 5.
#
# Beschleunigung X/Y-Homing 100 mm/s² (Stock-Kette _IF_MOVE_XY: M204 S2000
# -> _IF_HOME_Z: M204 S100 -> G28; passt zur Live-Dauer der zweiten
# Homing-Fahrt 1,40/1,42 s, mit S500 wären es ~0,5 s).
#
# FORCE_MOVE STEPPER=stepper_y DISTANCE=-3 VELOCITY=10 nach dem XY-Homing:
# ÜBERNOMMEN (gleiche Bedingungen wie Stock). Upstream-force_move bewegt nur
# den Motor von [stepper_y] und lässt die Toolhead-Position unverändert
# (Stock loggt dieselbe Zeile "FORCE_MOVE stepper_y distance=-3.000
# velocity=10.000 accel=0.000" -> gleicher Code-Stand). Bei CoreXY
# (Upstream: stepper_y = X - Y) verschiebt das die Düse physisch um
# X -1,5 / Y +1,5 mm gegenüber der Koordinate – genau so hat Creality
# position_endstop 352.5 / -6.2 kalibriert. Weglassen würde alle Drucke
# um 1,5/1,5 mm gegenüber Stock versetzen. Restrisiko (Vorzeichen/Achs-
# zuordnung) am Gerät prüfen: README.md §7.6.
#
# ERGÄNZT 16.10.2026 spät: BOX_GO_TO_EXTRUDE_POS + BOX_NOZZLE_CLEAN vor dem
# ersten Z-Homing -> _PI_NOZZLE_CLEAN (macros.cfg, README.md §7.2),
# braucht zusätzlich [k2_box] allow_move (sonst Meldung, Z-Antasten ohne
# Reinigung).
# Stock-Teile, die ENTFALLEN (README §2/§6):
#  - PRES_CHECK RUN=1/0 um die Reinigung (dynamischer Sensortest; Ersatz:
#    Signalweg- + Ruhetest in k2_prtouch vor jeder Antastung).
#  - (ERGÄNZT 16.10.2026: BED_MESH_PROFILE LOAD="default" nach dem Z-Homing
#    wie Stock, über _PI_MESH_LADEN.)
#  - print_stats.power_loss-Zweige (Power-Loss-Resume, Creality).
#  - Stall-Mode/Kp bei reinem G28 Z (Stock sendet sie bei JEDEM G28; hier
#    nur, wenn X oder Y referenziert wird – Z-Homing ohne RS485-Verkehr).
# Abweichung Reihenfolge: PHASE=END direkt nach X/Y (Stock: erst nach Z),
# damit ein Fehler beim Z-Homing X/Y nicht im Homing-Modus zurücklässt.
# Bricht G28 X/Y selbst ab (z.B. "No trigger"), setzt [k2_motor] X/Y
# automatisch zurück (Ereignis gcode:command_error).
# =====================================================================

[gcode_macro _PI_FREIGABE]
description: Zentrale Bewegungs-Freigabe (Default gesperrt)
# False = G28 bricht ohne Bewegung ab. Erst nach Inbetriebnahme-Schritt 4
# (README §4) auf True setzen (hier ODER zur Laufzeit:
# SET_GCODE_VARIABLE MACRO=_PI_FREIGABE VARIABLE=allow_move VALUE=True).
# 23.10.2026 (Nutzerwunsch, Inbetriebnahme abgeschlossen): ab Start freigegeben.
# Für eine erneute Inbetriebnahme/Fehlersuche wieder auf False setzen.
variable_allow_move: True
# Zusätzliche Not-Sperre NUR für X/Y (Default True = keine Extrasperre).
# X/Y-Homing braucht jetzt [k2_motor] allow_write: True (Stall-Mode 1 per
# KTWO_MOTOR_HOMING). False setzen, falls PB11/PB12 am Gerät nicht sicher
# auslösen. (Variable bleibt für ältere Test-G-Codes erhalten.)
variable_xy_stall_ok: True
gcode:
  {% set km = printer['k2_motor'] if 'k2_motor' in printer else none %}
  {action_respond_info("_PI_FREIGABE: allow_move=%s xy_stall_ok=%s k2_motor.allow_write=%s" % (
      printer["gcode_macro _PI_FREIGABE"].allow_move,
      printer["gcode_macro _PI_FREIGABE"].xy_stall_ok,
      km.allow_write if km is not none else "fehlt"))}

[gcode_macro _PI_VOR_HOMING]
description: Haken vor dem X/Y-Homing (Stall-Mode 1, Kp ID70 300)
gcode:
  # Stock: MOTOR_STALL_MODE DATA=1 + MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70
  # PARAMS=300. Fehler (Bus/Port/Echo) -> G-Code-Fehler, Rückbau, G28 bricht
  # VOR der ersten Bewegung ab.
  KTWO_MOTOR_HOMING PHASE=BEGIN

# NICHT AKTIV (Aufruf in homing_override entfernt, s. dort).
# 22.10.2026: G28 nach einem Neustart (X/Y stromlos, Kopf am Schacht Y378)
# löste Y sofort aus, der Rückzug (+10 mm) fuhr den Kopf hörbar gegen die
# Rückwand -> „Endstop stepper_y still triggered after retract“. Klipper
# bestromt die Motoren erst mit dem ersten Schritt, also NACH dem Scharf-
# schalten des Endstops; meldet der Closed-Loop-Motor beim Bestromen kurz
# Stall, gilt das als Anschlag. Darum vorher bestromen, 0,5 s warten und die
# Stall-Leitungen prüfen – steht eine noch an, Abbruch ohne Bewegung.
[gcode_macro _PI_XY_BEREIT]
description: Vor X/Y-Homing: Motoren bestromen, 0,5 s warten, Stall-Leitungen prüfen
gcode:
  SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
  SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
  G4 P500
  QUERY_ENDSTOPS
  _PI_XY_STALL_FREI

[gcode_macro _PI_XY_STALL_FREI]
description: Bricht G28 ab, wenn X/Y-Stall schon vor der ersten Bewegung meldet
gcode:
  {% set q = printer.query_endstops.last_query %}
  {% set an = [] %}
  # Schlüssel heißen je nach Klipper-Stand "stepper_x" (live 22.10.2026) oder "x"
  {% for a in ["x", "y"] %}
    {% if q.get("stepper_" ~ a) or q.get(a) %}{% set _ = an.append(a|upper) %}{% endif %}
  {% endfor %}
  {% if an %}
    {action_raise_error("G28 X/Y abgebrochen: Stall %s meldet schon VOR der ersten Bewegung (sonst Fehlauslösung + Rückzug gegen die Rückwand). Keine Bewegung – G28 erneut versuchen." % (an|join("/")))}
  {% endif %}

[gcode_macro _PI_NACH_HOMING]
description: Haken nach dem X/Y-Homing (Stall-Mode 2, Schutz, Kp 100)
gcode:
  # Stock: MOTOR_STALL_MODE DATA=2 + MOTOR_CHECK_PROTECTION_AFTER_HOME
  # DATA=11 + MOTOR_SYS_PARAM ... ID=70 PARAMS=100 (Kp aus [k2_motor]
  # x_controller_pos_loop_pid_param_kp). Schutzbits -> G-Code-Fehler.
  KTWO_MOTOR_HOMING PHASE=END

[gcode_macro _PI_HOME_Y]
description: Y sensorless referenzieren (Stock _HOME_Y)
gcode:
  M204 S100
  # Schon referenziert und zu nah am Anschlag (y < 8): erst freifahren
  {% if 'y' in printer.toolhead.homed_axes and printer.toolhead.position.y|round < 8 %}
    {% set y_park = 8 - printer.toolhead.position.y|round %}
    {% if y_park > 0 %}
      G91
      G1 Y{y_park} F6000
      G90
    {% endif %}
  {% endif %}
  G28 Y
  G91
  G1 Y10 F3600
  G90

[gcode_macro _PI_HOME_X]
description: X sensorless referenzieren (Stock _HOME_X)
gcode:
  M204 S100
  # Schon referenziert und < 10 mm vor X-max: erst freifahren
  {% if 'x' in printer.toolhead.homed_axes %}
    {% set rest = (printer.toolhead.axis_maximum.x - printer.toolhead.position.x)|round %}
    {% if rest < 10 %}
      G91
      G1 X-{10 - rest} F6000
      G90
    {% endif %}
  {% endif %}
  G28 X
  G91
  G1 X-10 F3600
  G90

[gcode_macro _PI_DUESE_STABIL]
description: Vor dem Z-Antasten warten, bis die Düse ihre Solltemperatur hat
gcode:
  # Heizt (oder kühlt) die Düse beim Antasten noch, wandert der Dehnungs-
  # streifen thermisch – der k2_prtouch-Ruhetest bricht dann ohne Bewegung ab
  # (22.10.2026: G29 direkt nach M104 S140, dif 3147 > 3000, gefiltert
  # 3030 > 2000). Stock merkt das nicht, weil sein erstes G28 Z das Bett erst
  # ganz nach unten fährt (ZDOWN) und die Düse dabei warm wird. Eigenes Makro,
  # damit die Temperatur erst direkt vor G28 Z gelesen wird.
  {% set ext = printer.extruder %}
  {% if ext.target|float > 0 and (ext.temperature|float - ext.target|float)|abs > 2 %}
    {action_respond_info("G28 Z: warte auf Düse %.0f °C (jetzt %.0f °C) – Wärmedrift stört das Antasten" % (ext.target, ext.temperature))}
    M109 S{ext.target}
    G4 P3000
  {% endif %}

[homing_override]
axes: xyz
gcode:
  {% set fr = printer["gcode_macro _PI_FREIGABE"] %}
  {% if not fr.allow_move %}
    {action_raise_error("G28 gesperrt: _PI_FREIGABE allow_move=False (README §4). Keine Bewegung.")}
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set do_y = home_all or 'Y' in params %}
  {% set do_x = home_all or 'X' in params %}
  {% set do_z = home_all or 'Z' in params %}
  {% set do_xy = do_x or do_y %}
  {% if do_xy %}
    {% if 'k2_motor' not in printer %}
      {action_raise_error("G28 X/Y gesperrt: [k2_motor] fehlt (Stall-Mode 1 nicht setzbar). Keine Bewegung.")}
    {% elif not printer['k2_motor'].allow_write %}
      {action_raise_error("G28 X/Y gesperrt: [k2_motor] allow_write=False – Stall-Mode 1 (PB11/PB12) kann nicht gesetzt werden. Keine Bewegung.")}
    {% elif not fr.xy_stall_ok %}
      {action_raise_error("G28 X/Y gesperrt: _PI_FREIGABE xy_stall_ok=False (Not-Sperre). Keine Bewegung.")}
    {% endif %}
  {% endif %}
  {% if do_z and not do_xy and ('x' not in homed or 'y' not in homed) %}
    {action_raise_error("G28 Z braucht vorher X und Y (Antasten in Bettmitte).")}
  {% endif %}
  {% if 'z' not in homed %}
    BED_MESH_CLEAR
  {% endif %}
  M204 S500
  {% if do_xy %}
    _PI_VOR_HOMING
    # _PI_XY_BEREIT bewusst NICHT aufgerufen (22.10.2026 spät): mit der
    # Vorprüfung (Motoren vorher bestromen) 3× gut, dann „No trigger on
    # stepper_y after full movement“ (Stall kam nicht am Anschlag). Ohne sie
    # lief Homing den ganzen Tag (> 10×) – zurück auf diesen Stand.
    {% if do_y %}
      _PI_HOME_Y
    {% endif %}
    {% if do_x %}
      _PI_HOME_X
    {% endif %}
    # Stock-Bedingungen für FORCE_MOVE stepper_y -3 (sensorless.cfg):
    # alle Achsen, X+Y, oder eine Achse, wenn vorher genau die andere
    # referenziert war (homed_axes == 'y' bzw. 'x').
    {% if (do_x and do_y) or (do_x and homed == 'y') or (do_y and homed == 'x') %}
      FORCE_MOVE STEPPER=stepper_y DISTANCE=-3 VELOCITY=10
    {% endif %}
    _PI_NACH_HOMING
  {% endif %}
  {% if do_z %}
    {% if 'z' not in homed %}
      # Stock sensorless.cfg:198-204: nur wenn Z noch nicht referenziert ist
      # BOX_GO_TO_EXTRUDE_POS + BOX_NOZZLE_CLEAN (Düse am Silikonstreifen
      # sauber, sonst verfälschen Rückstände das Antasten mit dem
      # Kraftsensor). Ohne Freigabe ([k2_box] allow_move) nur Meldung, das
      # Z-Antasten läuft trotzdem. PRES_CHECK RUN=1/0 (dynamischer
      # Dehnungsstreifen-Test während des Abstreifens) entfällt: k2_prtouch
      # prüft vor JEDER Antastung Signalweg (sta_swap) + Ruhe (dif <=
      # rest_max_dif) und fährt sonst nicht (README.md §7.2).
      _PI_NOZZLE_CLEAN WHY=G28
    {% endif %}
    # Mitte des Mesh-Bereichs (Stock _HOME_Z), Kühlung Düsenkopf aus wie Stock
    {% set bm = printer.configfile.settings.bed_mesh %}
    {% set cx = (bm.mesh_min[0] + bm.mesh_max[0]) / 2 %}
    {% set cy = (bm.mesh_min[1] + bm.mesh_max[1]) / 2 %}
    # Wiedereinstieg (k2_resume, 23.10.2026): KTWO_RESUME_ZHOME setzt einen
    # freien Antastpunkt NEBEN dem Teil – sonst würde mitten auf dem
    # gedruckten Teil angetastet. Nur für dieses eine G28 Z.
    {% if "k2_resume" in printer and printer.k2_resume.z_home_at %}
      {% set cx = printer.k2_resume.z_home_at[0] %}
      {% set cy = printer.k2_resume.z_home_at[1] %}
    {% endif %}
    SET_PIN PIN=extruder_fan VALUE=0
    M204 S2000
    G90
    G1 X{cx} Y{cy} F12000
    M204 S500
    _PI_DUESE_STABIL
    G28 Z
    G1 Z5 F600
    # Stock (sensorless.cfg): nach jedem Homing BED_MESH_PROFILE LOAD="default"
    # – eigenes Makro, damit die Profilprüfung erst zur
    # Laufzeit ausgewertet wird.
    _PI_MESH_LADEN
  {% endif %}
  M204 S{printer.configfile.settings.printer.max_accel}
