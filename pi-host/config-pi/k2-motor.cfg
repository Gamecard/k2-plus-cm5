# =====================================================================
# Closed-loop-Motoren [k2_motor] (pi-host/k2_motor_init.py -> extras/k2_motor.py)
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET.
# Modul-Fix 16.10.2026 abends (README §5.3): Objekt 'pins' statt 'ppins',
# Config-Callback ohne Argument, G-Codes KTWO_MOTOR_INIT/KTWO_MOTOR_STATUS
# (+ seit 16.10. spät KTWO_MOTOR_HOMING/_STALL_MODE/_SYS_PARAM/_PROTECTION),
# Strapping-Pins mit max_duration 0 (wie Stock setup_max_duration(0.0)),
# RS485 X/Y/Z/Z1 über [k2_485] (k2-module.cfg). Batch-Lauf F fehlerfrei.
#
# nozzle_mcu: Config-Name der Düsen-MCU wie in [mcu nozzle_mcu]; das Modul
# sucht zuerst das Upstream-Objekt "mcu nozzle_mcu" (wie k2_prtouch).
# =====================================================================

# ---------------------------------------------------------------------
# Closed-loop-Motoren (Ersatz für Creality-[motor_control])
# ---------------------------------------------------------------------
# Pins und <motor>_<param>-Werte 1:1 aus motor_control.cfg (live 16.10.2026).
# ACHTUNG Namensgebung: "motor_x" ist der Motor mit Adresse 0x81 an
# PB9/PB10 (= Pins von [stepper_y]), "motor_y" an !PB7/PB8 (= [stepper_x])
# – so im Stock, NICHT tauschen (Strapping-Adresse = 0x81 + 2*STEP + DIR).
[k2_motor]
switch: 1
motor_closed_loop: x,y,z,z1,e
retries: 4
overcurrent_switch: 0
# Stock cut_pos_offset (Cutter-Kompensation in mm) – nur durchgereicht
cut_pos_offset: 0.4
# --- Sicherheit (Erweiterungen des Moduls, Defaults sicher) ---
# GESPERRT: nur lesen + Plan. Für echten Init (Broadcast, Stall, Param-
# Schreiben) erst nach KTWO_MOTOR_INIT DRY_RUN=1 und lesendem Lauf auf True.
# allow_write ist AUCH die Freigabe für sensorless X/Y-Homing (homing.cfg:
# KTWO_MOTOR_HOMING setzt Stall-Mode 1/2 + Kp, README.md §7.6) – ohne True
# bricht G28 X/Y ohne Bewegung ab. Kein G-Code-Override (anders als
# KTWO_MOTOR_INIT ALLOW_WRITE=1).
allow_write: False
# Positionsregler-Kp (Sys-Param ID 70) von Motor x (0x81) während des
# X/Y-Homings (Stock sensorless.cfg PARAMS=300); danach zurück auf
# x_controller_pos_loop_pid_param_kp (100).
homing_pos_kp: 300
# Ordner für KTWO_MOTOR_CAL_BACKUP/_CHECK (Kalibrierwerte sichern/prüfen,
# nur lesend; Dateien 600, enthalten die Motor-UUID). Default:
#cal_backup_dir: ~/printer_data/k2-motor-cal
# Motor kalibrieren (KTWO_MOTOR_CAL_RUN/_RESTORE, README §14): Default AUS.
# Ein Lauf dreht den Motor ohne Schutz, kein Abbruch außer Netzschalter.
#allow_motor_calibration: False
#allow_encoder_calibration: False   # zusätzlich für MODE=ENCODER
#allow_z_calibration: False         # zusätzlich für Z/Z1
shutdown_on_failure: False
# Inbetriebnahme Schritt 1: False (kein Init beim Connect). Erst ab Schritt 3
# auf True.
auto_init: False
main_mcu: mcu
nozzle_mcu: nozzle_mcu
# --- Stall-/Notfall-Überwachung im Betrieb (README.md §7.6,
# ../README.md §11) ---
# Die fünf motor_<m>_stall-Leitungen (unten, ohne ^/! wie Stock, aktiv high)
# werden zur Config-Zeit per Upstream-[buttons] überwacht (MCU tastet alle
# 2 ms ab). Steigende Flanke nach Init (is_ready) -> 0C [0b] lesen, key781-797
# melden. X/Y ignoriert während Homing/Mode 1/3 (+0,05 s), Cut-Kalibrierung
# nur cut_state.
#   off    = keine Registrierung (Notausweg, falls buttons Probleme macht)
#   report = nur melden (DEFAULT, Einführungsphase)
#   act    = reagieren: X/Y/Z/Z1-Fehler im Druck -> Not-Stopp (Shutdown mit
#            key-Codes, wie Stock-Abbruch), ohne Druck -> M84; nur Warnung ->
#            PAUSE im Druck; E -> PAUSE im Druck + Extruder aus.
# Erst nach Gerätetest (README.md §7.6) auf act. Codes werden NIE
# automatisch gelöscht: KTWO_MOTOR_CLEAR (braucht allow_write: True).
# PB11/PB12 sind zugleich endstop_pin -> [duplicate_pin_override] in
# printer.cfg (enthält PB11, PB12, PB13, PA10) bleibt Pflicht.
stall_monitor: report
# --- Pins (Stock) ---
motor_closed_loop: x,y,z,z1,e
motor_x_dir: PB9,0
motor_x_step: PB10,0
motor_x_stall: PB11
motor_y_dir: !PB7,0
motor_y_step: PB8,0
motor_y_stall: PB12
motor_z_dir: PB5,0
motor_z_step: PB6,1
motor_z_stall: PB13
motor_z1_dir: PA1,1
motor_z1_step: PB15,1
motor_z1_stall: PA10
motor_e_stall: nozzle_mcu:PB12
# --- Parameter (Stock, nur die aktiven Zeilen aus motor_control.cfg) ---
# ID 226 (*_stall_pos_err_rad_for_slicer) = reiner Host-Parameter, wird vom
# Modul NIE gesendet (wie Stock).
x_controller_pos_loop_pid_param_kp: 100
x_controller_spd_loop_pid_param_kp: 0.028
x_controller_spd_loop_pid_param_ki: 6.0
x_controller_cur_loop_pid_param_kp: 2.5
x_controller_cur_loop_pid_param_ki: 200.0
x_controller_leso_param_b0k: 1.0
x_controller_leso_param_z3k: 0
x_controller_leso_param_wp: 4000
x_controller_leso_param_ws: 4000
x_controller_leso_param_wd: 400
x_protection_param_prt_track_max_err: 0.3
x_protection_param_prt_track_err_time: 0.1
x_stall_pos_err_rad_for_slicer: 0.016375
y_controller_pos_loop_pid_param_kp: 300
y_controller_spd_loop_pid_param_kp: 0.028
y_controller_spd_loop_pid_param_ki: 6.0
y_controller_cur_loop_pid_param_kp: 2.5
y_controller_cur_loop_pid_param_ki: 200.0
y_controller_leso_param_b0k: 1.0
