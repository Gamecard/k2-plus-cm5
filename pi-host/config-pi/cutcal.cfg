# =====================================================================
# Schnittpositions-Kalibrierung (Ersatz Stock CALIBRATE_CUT_POS)
# =====================================================================
# ENTWURF 16.10.2026 Nacht – am Gerät UNGETESTET. Doku: README.md §7.5,
# pi-host/README.md §10. Einbinden in printer.cfg (Reihenfolge egal, die
# Makros greifen erst zur Laufzeit auf _PI_FREIGABE/[k2_motor] zu):
#   [include cutcal.cfg]
#
# Stock (gcode_macro.cfg CALIBRATE_CUT_POS):
#   G28 (falls nicht xyz), SET_LIMITS, MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70
#   PARAMS=300, MOTOR_CHECK_CUT_POS, M400, MOTOR_SYS_PARAM … PARAMS=100,
#   RESTORE_LIMITS; MOTOR_CHECK_CUT_POS speichert selbst (CXSAVE_CONFIG).
# Pi: KTWO_MOTOR_CUT_CAL ([k2_motor]) fährt Kp 300 / Stall-Mode 3 /
#   Beschleunigung / Anstöße / Rückbau (Mode 2, Kp 100, Beschleunigung) in
#   EINEM Befehl – der Rückbau läuft dadurch auch bei jedem Fehler. Das
#   Ergebnis wird nur VORGEMERKT ([k2_box] cut_pos_x); SAVE_CONFIG schreibt
#   es (Upstream: mit Neustart) – hier per SAVE=1 oder von Hand.
#   ACHTUNG: Solange k2-module.cfg [k2_box] selbst "cut_pos_x:" enthält,
#   verweigert Upstream-SAVE_CONFIG ("conflicts with included value") –
#   Zeile dort entfernen (k2_box-Default -7.80 greift).
#
# Sperren (vor JEDER Bewegung, kein Frame): _PI_FREIGABE allow_move,
# [k2_motor] allow_write, kein laufendes X/Y-Homing, kein Filament im Kopf
# (Stock-Fehler key854). Das Modul prüft allow_write und allow_move
# zusätzlich selbst (auch beim direkten Aufruf von KTWO_MOTOR_CUT_CAL).
# Abweichung von Stock (bewusst): nur X/Y müssen referenziert sein (Z wird
# nicht bewegt) -> "G28 X Y" statt "G28".
# =====================================================================

[gcode_macro CALIBRATE_CUT_POS]
description: Schnittposition kalibrieren (Stock-Name; SAVE=1 speichert sofort)
gcode:
  {% set fr = printer["gcode_macro _PI_FREIGABE"] if "gcode_macro _PI_FREIGABE" in printer else none %}
  {% set km = printer["k2_motor"] if "k2_motor" in printer else none %}
  {% set fsn = "filament_switch_sensor filament_sensor" %}
  {% set fs = printer[fsn] if fsn in printer else none %}
  {% if fr is none or not fr.allow_move %}
    {action_raise_error("CALIBRATE_CUT_POS gesperrt: _PI_FREIGABE allow_move=False (README §4). Keine Bewegung.")}
  {% endif %}
  {% if km is none or not km.allow_write %}
    {action_raise_error("CALIBRATE_CUT_POS gesperrt: [k2_motor] allow_write=False. Nichts gesendet, keine Bewegung.")}
  {% endif %}
  {% if km.homing_active or km.cut_cal.active %}
    {action_raise_error("CALIBRATE_CUT_POS gesperrt: Homing bzw. Kalibrierung läuft noch. Keine Bewegung.")}
  {% endif %}
  {% if fs is not none and fs.enabled and fs.filament_detected %}
    {action_raise_error("CALIBRATE_CUT_POS gesperrt: Filament im Kopf erkannt – erst entladen (Stock key854). Keine Bewegung.")}
  {% endif %}
  {% if "x" not in printer.toolhead.homed_axes or "y" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}
  SAVE_GCODE_STATE NAME=_cutcal
  # L3 (18.10.2026): wie Stock SET_LIMITS ... RESTORE_LIMITS. Betriebsfenster
  # X ab cut_pos_x -> Anstöße bis check_cut_pos_x_min (-9,5) brauchen das
  # weite Fenster (X ab -10; KTWO_MOTOR_CUT_CAL prüft gegen rail.get_range).
  # Fehler in KTWO_MOTOR_CUT_CAL -> [k2_limits] setzt selbst zurück.
  KTWO_LIMITS_WIDE REASON=CALIBRATE_CUT_POS
  KTWO_MOTOR_CUT_CAL
  M400
  KTWO_LIMITS_RESTORE
  RESTORE_GCODE_STATE NAME=_cutcal
  _CUTCAL_MELDUNG
  {% if params.SAVE|default(0)|int == 1 %}
    SAVE_CONFIG
  {% endif %}

[gcode_macro _CUTCAL_MELDUNG]
description: Ergebnis der letzten Schnittpositions-Kalibrierung melden
gcode:
  {% set cc = printer.k2_motor.cut_cal %}
  {% if cc.saved %}
    {action_respond_info("CALIBRATE_CUT_POS: cut_pos_x = %.2f vorgemerkt (Treffer X=%.2f / X=%.2f, %d Anstöße). Übernahme mit SAVE_CONFIG (Neustart); k2-module.cfg darf cut_pos_x dann nicht mehr enthalten." % (cc.result, cc.first_hit, cc.second_hit, cc.probes))}
  {% else %}
    {action_respond_info("CALIBRATE_CUT_POS: kein Ergebnis (%s)" % (cc.error,))}
  {% endif %}
