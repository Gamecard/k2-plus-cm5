# =====================================================================
# K2-eigene Module für Upstream-Klipper (pi-host/k2_*.py)
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET. Eingebunden von printer.cfg.
# [k2_prtouch] steht in printer.cfg (SAVE_CONFIG von z_offset).
#
# [k2_motor] steht in k2-motor.cfg.
#
# Installation (README.md §3) – alles nach ~/klipper/klippy/extras/:
#   pi-host/k2_transport.py   -> extras/k2_transport.py
#   pi-host/k2_485.py         -> extras/k2_485.py
#   pi-host/k2_motor_init.py  -> extras/k2_motor.py   (Name = Abschnitt!)
#   pi-host/k2_box.py         -> extras/k2_box.py
#   pi-host/k2_prtouch.py     -> extras/k2_prtouch.py
#   pi-host/k2_belt.py        -> extras/k2_belt.py
#   pi-host/k2_safety.py      -> extras/k2_safety.py
#   nachbau/*.py              -> extras/k2_nachbau/   (Pflicht für k2_box,
#                               k2_485; wird nur ANGEHÄNGT an sys.path)
#
# RS485 (Stock /dev/ttyS5, 230400 8N1, EIN Bus für Motoren X/Y/Z/Z1 + CFS +
# Belt): auf dem Pi ein USB-RS485-Adapter mit Auto-DE. Gemeinsames Objekt
# 'k2_485' (Modul k2_485.py): GENAU EINE nachbau/serial485.Serial485-Instanz
# (ein Port, ein Lock). [k2_motor] (X/Y/Z/Z1), [k2_box] und [k2_belt] nutzen
# sie; die Reihenfolge der Abschnitte ist egal.
# Port wird erst beim Connect geöffnet (Batch-Modus: nie). Fehlt der Port,
# meldet [k2_485] das beim Connect und bei jedem Zugriff – kein Absturz,
# kein Shutdown (README.md §6.2, k2_485.py-Docstring). KTWO_BUS_STATUS zeigt
# Zustand/Zähler ohne Bus-Verkehr.
# ---------------------------------------------------------------------
# Sicherheit (README-k2_safety.md, L1/L4)
# ---------------------------------------------------------------------
# Modul pi-host/k2_safety.py -> klippy/extras/k2_safety.py.
# L1: Creality-MCU-FW meldet „mcu0/noz0 ADC out of range" nur als
# fakeshutdown (MCU läuft weiter). k2_safety: sofort alle Heizer-Ziele 0 +
# Klipper-Shutdown (emergency_stop an alle MCUs). NICHT abschalten –
# fakeshutdown_guard: False nur zur Fehlersuche (dann wie Upstream: nur Log).
# L4: Sollwert-Obergrenzen wie Stock product_param (F008 printer_params.cfg):
# Düse 350, Bett 120, Kammer 60 – gilt für M104/M109/M140/M190/M141/M191,
# SET_HEATER_TEMPERATURE und PID_CALIBRATE. clamp = kappen + Warnung (Stock),
# error = Befehl abweisen. Status: KTWO_SAFETY_STATUS.
[k2_safety]
fakeshutdown_guard: True
mcus: mcu, nozzle_mcu
max_nozzle_temp: 350
max_bed_temp: 120
max_chamber_temp: 60
over_limit: clamp
nozzle_heater: extruder
bed_heater: heater_bed
chamber_heater: chamber_heater

# ---------------------------------------------------------------------
[k2_485]
# PLATZHALTER/ANNAHME – echten Namen per `ls -l /dev/serial/by-id/` eintragen
serial: /dev/serial/by-id/usb-ANNAHME_USB-RS485-if00-port0
baud: 230400
# Konsolen-Warnung bei Bus-Störungen je Fenster (README-k2_konsole.md);
# Defaults, 0 = Kriterium aus:
#warn_window: 600
#warn_timeouts: 30
#warn_crc_errors: 10
#warn_retries: 30

# ---------------------------------------------------------------------
# CFS-Box (Ersatz für Creality-[box] + [serial_485 serial485] + [auto_addr])
# ---------------------------------------------------------------------
# Auto-Addr läuft erst nach dem Event k2_motor:ready (gleiche Reihenfolge
# wie Stock). Filamentwechsel (T0–T15 / M8200, macros.cfg) über die
# KTWO_BOX_*-Schritte – Ablauf und Bedienung: README.md §7.1.
# Die Stock-[box]-Werte stehen unten im Stock-Stil (Namen wie box.cfg;
# Klipper schreibt Optionsnamen klein, "Tn_retrude" == "tn_retrude").
# cut_pos_x steht hier bewusst NICHT: Upstream-SAVE_CONFIG bricht sonst ab
# („section 'k2_box' option 'cut_pos_x' conflicts with included value“).
# Wert = k2_box-Default -7.80 (SAVE_CONFIG-Wert der Stock-Kalibrierung vom
# 16.10.2026, Stock-printer.cfg "#*# [box] cut_pos_x = -7.80") bzw. nach
# `CALIBRATE_CUT_POS SAVE=1` aus dem SAVE_CONFIG-Block von printer.cfg
# (README.md §7.5, cutcal.cfg).
#
# Auto-Nachladen bei Runout (A7): [filament_switch_sensor filament_sensor]
# runout_gcode -> KTWO_BOX_RUNOUT (Ablauf, Slot-Wahl:
# README.md §7.4).
[k2_box]
box_addr: 1
# GESPERRT: nur lesen (0x0a-Poll, RFID, Remain, Version). Load/Unload/
# Preload/Auto-Addr/Wechsel-Box-Schritte erst mit True.
allow_write: False
# GESPERRT: Kopf-/Extruder-Bewegung + Heizen der Wechsel-Schritte
# (Schneiden, Schacht, Spülen, Abstreifen). Ohne beide Freigaben: T0 =
# Einfarbbetrieb, T1..T15/M8200 = nur Plan, im Druck -> PAUSE.
allow_move: False
shutdown_on_failure: False
# Fehler im Wechsel während des Drucks -> PAUSE (statt Abbruch/Shutdown)
pause_on_failure: True
auto_init: True
poll_interval: 4.0
# Stock [box] filament_sensor (Kopfsensor ^!nozzle_mcu:PA11, printer.cfg)
filament_sensor: filament_sensor
# Stock [box] switch_pin: !nozzle_mcu:PB9 (Schneidhebel). Prüfung nur, wenn
# ein [filament_switch_sensor <name>] dafür angelegt ist (ANNAHME: Pegel
# "detected" = Hebel bereit); leer = keine Prüfung.
cut_sensor:
# --- Schneiden (box.cfg + SAVE_CONFIG) ---
pre_cut_pos_x: 10
pre_cut_pos_y: 200
# cut_pos_x: Default -7.80 bzw. SAVE_CONFIG (s. oben) – hier NICHT eintragen
cut_pos_y: 200
cut_velocity: 30000
cut_accel: 5000
# ANNAHME: Verweilzeit am Schneidhebel (s); ohne Halt verrundet der
# Input-Shaper die Umkehr (Batch: X -7,69 statt -7,80)
cut_dwell: 0.1
check_cut_pos_x_min: -9.5
check_cut_pos_x_max: -5.5
# --- Extruder (box.cfg) ---
Tn_retrude: -10
Tn_retrude_velocity: 600
# Fallback-Temperatur ohne Material-DB bzw. für unbekanntes Material (Stock)
Tn_extrude_temp: 220
# Stock-Fallback der Spülmenge ohne bekannte Farben (140 -> 90 + 70 mm)
Tn_extrude: 140
Tn_extrude_velocity: 360
buffer_empty_len: 30
# --- Schacht / Abstreifer (box.cfg + T0-Beispiel) ---
extrude_pos_x: 133
extrude_pos_y: 378
extrude_entry_pos_x: 139
safe_pos_x: 225
safe_pos_y: 345
clean_left_pos_x: 135
clean_left_pos_y: 378
clean_right_pos_x: 160
clean_right_pos_y: 378
clean_velocity: 12000
clean_pos_left_x: 160
clean_pos_right_x: 170
clean_pos_middle_y: 374
box_first_clean_length: 90
box_need_clean_length: 70
travel_velocity: 12000
z_velocity: 600
change_z_hop: 0.4
# --- Wartezeiten (live "timeout = 90"; Rest ANNAHME) ---
extrude_sensor_timeout: 90
extrude_poll_interval: 2.0
stage7_delay: 2.0
# Box-Zustand abwarten (KTWO_BOX_WAIT, vor RETRUDE/EXTRUDE): >= 380 s =
# preload_force_timeout eines Slots (Box-Auto-Preload bis 364 s;
# bis 17.10.2026 200 s)
box_wait_timeout: 380
# --- Material-Datenbank + Spülen wie Stock (17.10.2026, README-k2_box.md §12,
#     README.md §7.3) ---
# Creality material_database.json (Wechsel-/Spültemperatur, Spül-/Einzugs-
# und RESUME-Vorextrusions-Geschwindigkeit je Material; Schlüssel = RFID-
# material_type des Slots). Wird von install.sh vom Drucker kopiert – NICHT
# im Repo. Auskommentiert/leer = aus: bisheriges Verhalten (max(Ziel,
# Tn_extrude_temp), feste Geschwindigkeiten, RESUME 460 mm/min). Fehlt die
# Datei oder ist sie kaputt: ebenfalls bisheriges Verhalten + Meldung.
#material_database: ~/printer_data/config/k2/material_database.json
# Spülmenge: color = Stock (Farbvolumen aus alter/neuer RFID-Farbe,
# (V + nozzle_volume)/2,4 · flush_multiplier, anderes Material ×2/min 370,
# sonst min 160; Farbe unbekannt -> Tn_extrude 140 -> 90 + 70 mm wie bisher).
# fixed = immer box_first + box_need (90 + 70), LENGTH= in 90er-Stücken.
# matrix (Default seit 18.10.2026 = Stock) = im
# laufenden Druck (print_stats printing) die Slicer-Spülmatrix der G-Code-
# Datei (Orca „; flush_volumes_matrix =“/„; flush_multiplier =“, Kopf + Ende
# je 512 KiB wie Stock): M[alt][neu]/2,4 · multiplier (ohne nozzle_volume),
# dann wie color anders ×2/min 370, sonst min 160. Index = TOOL=<n> aus
# T<n> bzw. M8200 L I<n>, altes Werkzeug = Slot des letzten Spülens IN
# DIESEM DRUCK. Der ERSTE Einzug eines Drucks nimmt wie Stock den Farbweg
# (Düsen-Farbe aus remain_material -> neue Slot-Farbe; Zurücksetzen bei
# Druckstart/-ende: virtual_sdcard reset_file, KTWO_BOX_PRINT_START,
# print_stats-Druckwechsel). Keine Matrix/nicht quadratisch/Index zu groß
# -> WARNUNG + color; nicht im Druck -> Hinweis + color (Stock-Rückfall).
# Zeilenform und Stock-Verhalten am Orca-Mehrfarbdruck 18.10.2026 belegt
# (Live: 1. Einzug 229,6 mm [90, 70, 70], Wechsel 160 mm [90, 70]).
# Bisheriges Verhalten (immer Farbweg): flush_mode: color
flush_mode: matrix
# Material in der Düse (Farbe/Typ des zuletzt gespülten Filaments) über
# Neustarts merken – Stock remain_material_data.json, gleiches Format
# {"remain_material": {"color": "0RRGGBB"|null, "type": "<id>"|null}}
# (+ "tnn"). Gelesen einmal beim Start (klippy:connect), geschrieben nur nach
# erfolgreichem Spülen und nur bei Änderung (atomar). Fehlt/kaputt: nur
# WARNUNG, Material unbekannt (90 + 70 mm wie bisher); eine kaputte Datei
# wird als <datei>.defekt-<zeit> beiseitegelegt, nie überschrieben.
# Stock-Datei vom Drucker (/mnt/UDISK/creality/userdata/box/
# remain_material_data.json) kann 1:1 als Startwert dienen. Leer = aus.
# Von Hand: KTWO_BOX_REMAIN [COLOR=] [TYPE=] [TNN=] [CLEAR=1] (Nicht-Stock).
remain_material_file: ~/printer_data/config/k2/remain_material.json
# Slot-Farbe/-Material von Hand (KTWO_BOX_SLOT_SET = Stock
# BOX_MODIFY_TN_DATA, z. B. Spule ohne/mit defektem RFID-Etikett) über
# Neustarts merken – Stock persistiert Tn_data ebenso (tn_data.json).
# {"slots": {"T1A": {"color": "0RRGGBB"|null, "type": "<id>"|null}}},
# atomar geschrieben bei jeder Änderung. Handwert gilt je Feld vor dem
# Etikett, bis ein LESBARES Etikett des Slots gelesen wird (KTWO_BOX_RFID,
# Laden, Runout) – dann RFID. Kaputt: WARNUNG + .defekt-<zeit>. Leer = aus.
slot_material_file: ~/printer_data/config/k2/slot_material.json
# Reinigung: stock = zwischen den Abschnitten nur Blech (X170 -> X135 +
# 3× Schütteln, bleibt im Schacht), Silikon-Kreise (G2/G3, Startversatz
# 0..flush_wipe_offset mm) + Ausfahrt nur nach dem letzten; legacy = volles
# Abstreifen mit Kreisen nach JEDEM Abschnitt (Stand bis 17.10.2026).
flush_clean: stock
flush_wipe_offset: 3
# Stock ACCEL_TO_DECEL=ACCEL beim Wischen = Upstream MINIMUM_CRUISE_RATIO 0
# (wird danach auf den alten Wert zurückgesetzt)
wipe_minimum_cruise_ratio: 0
# Stock: M106 P0 S50 zu Beginn, nach jedem Abschnitt fan0 5 s voll, am Ende
# Lüfter wie vorher. False = kein Lüfter beim Spülen.
flush_blow: True
flush_blow_fan: fan0
flush_fan_start: 50
flush_blow_time: 5
# Stock-[box]-Spülwerte (BoxCfg-Defaults)
box_need_clean_length_max: 100
nozzle_volume: 183
flush_multiplier: 1
diff_material_type_min_flush_len: 370
# 80 %-Teil jedes Abschnitts außer dem letzten mit v·1,2 (1 = eine
# Geschwindigkeit wie bis 17.10.2026)
flush_velocity_factor: 1.2
max_temp_flush_times: 3
baseline_nozzle_diameter: 0.4
# Verstopfungsprüfung (Stock key845: Messrad < 10 mm über alle Abschnitte)
# – nur WARNUNG, Default AUS (live 2× ausgelöst trotz Spülen, ungeklärt)
flush_clog_check: False
flush_clog_min_mm: 10
# --- Auto-Nachladen bei Runout (A7, README.md §7.4) ---
# AUS (Default). Wirkt zusätzlich NUR mit allow_write UND allow_move; sonst
# bleibt der Druck beim Runout pausiert (= Upstream-Standard). Laufzeit:
# KTWO_BOX_AUTO_REFILL ENABLE=0|1 (= Stock BOX_ENABLE_AUTO_REFILL).
runout_refill: False
# Ersatz-Slot ohne Gleich-Material-Gruppe: RFID gleiches Material (mat_id)
# UND gleiche Farbe (False = Farbe egal). Slots ohne RFID-Etikett nur über
# KTWO_BOX_SAME_MATERIAL LIST=T1A,T1C/... (= Stock BOX_UPDATE_SAME_MATERIAL_LIST).
runout_require_color: True
# Nach erfolgreichem Nachladen automatisch RESUME (False = pausiert lassen)
runout_resume: True
# Stock runout_gcode "G0 E30 F600" (Restfilament durch die Zahnräder),
# hier im Abfallschacht nach dem Heizen; 0 = aus
runout_tail_length: 30
runout_tail_velocity: 600
# --- RESUME nach abgebrochenem CFS-Wechsel (README.md §7.2) ---
# Immer aktiv: meldet der Kopf-Filamentsensor (filament_sensor, oben) nach
# einem abgebrochenen Wechsel KEIN Filament, verweigert RESUME (Druck bleibt
# pausiert; T<n> in der Pause, dann RESUME). Ohne Sensorzustand ebenfalls
# gesperrt, bis KTWO_BOX_ERROR_CLEAR HEAD_LOADED=1.
# AUS (Default): True = abgebrochenen T<n>-Wechsel beim RESUME automatisch
# nachholen wie Stock error_resume_process (Schacht, Heizen, Rückzug nur bei
# belegtem Hub, Einzug, Spülen). Wirkt zusätzlich NUR mit allow_write UND
# allow_move; jeder Fehler sperrt RESUME (Stock resume_err).
resume_redo_change: False
# --- Restmaterial + Druckende (README-k2_box.md §12.5) ---
# Restmaterial: meldet die Box im Druck Status 0x50 (Spule im CFS leer, der
# Rest steckt noch im Schlauch, gedruckt wird weiter), spült der nächste
# Wechsel (T<n>/M8200 P = KTWO_BOX_PRE_OPT) bzw. das Druckende den Rest aus
# statt zu schneiden und zurückzuziehen (Stock is_use_ending_material ->
# extrusion_all_materials): Kopfsensor aus, Schacht, Heizen, je 80 mm mit
# max_vol/2,4·60 (Material-DB; ohne DB Tn_extrude_velocity), Blasen + Blech
# ohne Kreise, bis der Kopfsensor leer meldet + 1 Stück, höchstens
# max_tube_length; danach Box IDLE, Slot vergessen. Wirkt nur mit
# allow_write UND allow_move (sonst Plan bzw. im Druck Pause). Kopfsensor
# ohne Zustand -> Pause + Meldung (nie blind fördern). True = Stock.
# False = Schnitt + Rückzug wie bis 17.10.2026. Von Hand: KTWO_BOX_ENDING.
ending_material_purge: True
# Stock BoxCfg max_tube_length: Obergrenze des Ausspülens (mm, 80..10000;
# das letzte Stück wird gekürzt, meldet der Kopf dann noch Filament ->
# Fehler/Pause)
max_tube_length: 3000
# Zeitlimit des Ausspülens (s, Pi-Zusatz; Stock hat keins) -> Fehler/Pause
ending_material_timeout: 3600
# Druckende (END_PRINT -> KTWO_BOX_END_PRINT, = Stock BOX_END): True =
# heizen, schneiden, Filament in die Box zurückziehen (Kopf leer, nächster
# Druck lädt neu). Default True seit 18.10.2026 – Stock entlädt am
# Druckende IMMER (2x live beobachtet: 12.10., 18.10.; A5). False = Filament bleibt im Kopf (Verhalten bis 18.10.).
# Kein Spülen am Druckende. Fehler -> nur Meldung, END_PRINT läuft weiter.
end_print_unload: True
# Abbruch (CANCEL über Mainsail/Webhook) unterbricht lange Box-Vorgänge
# (Einzug, Spülen, Ausspülen, wait_box_ready) zwischen den Schritten;
# einzelne Box-Transaktionen laufen zu Ende (C2, README-k2_box.md §17).
#cancel_interrupt: True
# --- Externe Spule (19.10.2026, README-k2_box.md §18) ---
# Filamentquelle cfs|extern (Makros SET_FILAMENT_SOURCE SOURCE=EXTERNAL|CFS; der Schlauch
# wird von Hand umgesteckt) + zuletzt geladenes externes Material (Material-
# ID/Name, Farbe, Hand-Temperatur) über Neustarts merken:
# {"source": "cfs"|"extern", "extern_material": {…}|null}, atomar bei jeder
# Änderung. Fehlt/kaputt: Quelle CFS (+ WARNUNG, kaputte Datei als
# .defekt-<zeit> beiseitegelegt). Leer = aus (nach dem Start Quelle CFS).
filament_source_file: ~/printer_data/config/k2/filament_source.json
# RFID-Leser der externen Spule (Gerät 0x11, nur Lesebefehl 0x02): AUS
# (Default). True + [gcode_button extern_spule] in printer.cfg -> beim
# Aufsetzen einer Spule KTWO_EXTERN_RFID (Etikett überschreibt das
# gespeicherte externe Material).
extern_rfid: False

# ---------------------------------------------------------------------
# Riemenspannungs-Module (Ersatz für Creality-[belt_mdl mdlx/mdly])
# ---------------------------------------------------------------------
# Modul pi-host/k2_belt.py -> klippy/extras/k2_belt.py (README-k2_belt.md).
# Werte 1:1 Stock; Adresse aus dem Namen (mdlx 0x21, mdly 0x22). Holt den Bus
# 'k2_485' wie [k2_box] (s. oben). GESPERRT: allow_write
# (Flash: CALI/MOVE/SET) und allow_move (Schieber/Motor-0x05/FORCE_MOVE).
# Achtung: KTWO_BELT_CALI nur OHNE Riemen. Der Rüttel-Zyklus (Default-
# cycle_gcode) fährt X/Y per FORCE_MOVE je ±200 mm ohne Endschalterschutz.
# Stock-Makro BELT_TENSION ist bewusst NICHT aktiv (fährt G28 X Y + Spannen);
# Ersatz-Beispiel KTWO_BELT_TENSION steht in README-k2_belt.md und ist unter
# Upstream jetzt gültig – erst nach Freigabe (README-k2_belt.md §6) einfügen.
# Belt-Firmware (18.10.2026, README-k2_belt.md §4a): ADC/Kalibrierwerte
# signed, Messfrische nach fun 8, 5 ms Busruhe vor Belt-Requests, fun 8 max.
# max_steps_units je Befehl. Defaults (gelten auch ohne Eintrag):
#max_steps_units: 50
#move_settle: 0.1
#measure_discard: 1
#measure_interval: 0.11
#bus_gap: 0.005
[k2_belt mdlx]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15
# 23.10.2026: freigegeben für das Makro BELT_TENSION (live geprüft 10.4/10.5)
allow_write: True
allow_move: True
stock_aliases: False

[k2_belt mdly]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15
# 23.10.2026: freigegeben für das Makro BELT_TENSION (live geprüft 10.4/10.5)
allow_write: True
allow_move: True
stock_aliases: False

# ---------------------------------------------------------------------
# Düsen-Temperaturkompensation (Ersatz für Creality-prtouch_v3
# get_z_now_comp / SET_TEMP_NOT_LINEAR)
# ---------------------------------------------------------------------
# Modul pi-host/k2_nozzle_tempcomp.py -> klippy/extras/k2_nozzle_tempcomp.py
# (README-k2_nozzle_tempcomp.md). Z-Zuschlag (Düse höher) wie Stock:
#   comp = 0 für ΔT <= 0, sonst min(max_comp, a·ΔT² + b·ΔT + c), fest auf
#   0…0,2 mm begrenzt; ΔT = Düsen-SOLL − Referenz (geglättete Düsen-IST-
#   Temperatur beim letzten G28 Z bzw. BED_MESH_CALIBRATE).
#   220 °C bei Referenz ~140 °C -> +0,050 mm, 240 °C -> +0,069 mm.
# Wirkt nur im Druck (print_stats printing/paused) UND mit geladenem Netz,
# neu gerechnet nur bei Solländerung. Bewegungs-Transform direkt über
# bed_mesh (unter [k2_limits]); Reihenfolge der Abschnitte egal.
# AN wie Stock (Stock nutzt es live). Abschalten: enable: False bzw. zur
# Laufzeit KTWO_NOZZLE_TEMPCOMP ENABLE=0. Status: KTWO_NOZZLE_TEMPCOMP.
[k2_nozzle_tempcomp]
enable: True
# Stock-Koeffizienten (prtouch_v3 temp_non_linaer_a/b/c, Code-Defaults)
a: 5.1e-06
b: 0.0
c: 0.017316
# Stock-Obergrenze der Kennlinie (0…0,2; die Endklemme 0,2 ist fest)
max_comp: 0.181
# True = mit dem Netz-Fade ausblenden (voll bis fade_start 5 mm, 0 ab
# fade_end 50 mm) wie Stock; False = konstanter Zuschlag in jeder Höhe
fade_with_mesh: True
# Referenz auch nach BED_MESH_CALIBRATE aufnehmen (Stock)
ref_on_mesh_calibrate: True
heater: extruder

# ---------------------------------------------------------------------
# Druckdatei-Prüfung vor dem Start (Vorfall 23.10.2026: Datei mit Bambu-
# Lab-Druckerprofil lief mit Bambu-Startcode an)
# ---------------------------------------------------------------------
# Modul pi-host/k2_dateipruefung.py -> klippy/extras/k2_dateipruefung.py
# (README-k2_dateipruefung.md). Eingehängt über das Makro SDCARD_PRINT_FILE
# (macros.cfg, rename_existing: SDCARD_PRINT_FILE_BASE) – gilt damit für
# jeden Start aus Mainsail/Moonraker/Orca und für PRINT_FROM_LAYER START=1.
# Abbruch, wenn „; printer_model = …“ zu keinem erlaubten Modell passt
# (Teilstring ohne Groß/Klein, am Wortanfang) oder – ohne printer_model –
# Bambu-Befehle (M1006, G380, M620, …) am Dateianfang stehen. Ohne beides:
# nur Hinweis „Druckerprofil unbekannt“, Druck läuft.
# Liest nur Dateiende (512 KiB) und Anfang (bis 64 KiB Befehle, max. 1 MiB).
# Abschalten bis zum Neustart: KTWO_DATEI_PRUEFUNG AKTIV=0 (Zustand:
# KTWO_DATEI_PRUEFUNG); dauerhaft: aktiv: False.
[k2_dateipruefung]
aktiv: True
erlaubte_modelle: K2
# Profilname, den die Fehlermeldung zum Neu-Slicen nennt:
#slicer_profil: Creality K2 Plus 0.4 nozzle - Pi
# Bambu-only-Befehle (Default: M1006, G380, M620, M621, M1002, M975, M960,
# G29.1, M142, M977, M622, M623, M624, M625, M970, M974, M982, M991, M1007,
# G392); Komma-Liste ersetzt den Default komplett:
