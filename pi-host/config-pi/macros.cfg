# Creality-Box-Kette wie Stock box.cfg (Creality Print kann jedes Tn durch
# die Kette ersetzen, s. Stock-Kommentar „举例T0…“):
#   M8200 P [S<next>]   Wechsel vorbereiten   -> KTWO_BOX_PRE_OPT (Z_HOP=0:
#                       die Kette des Slicers hebt Z selbst, T0-Beispiel 1.)
#   M8200 C [S0]        schneiden             -> KTWO_BOX_CUT
#   M8200 R [I<pre>]    in Box zurück         -> KTWO_BOX_RETRUDE
#   M8200 R E<x> (x≠0)  NUR Extruder-Rückzug  -> KTWO_BOX_BREAK_RETRUDE LENGTH=<x>
#                       (Stock CR_BOX_RETRUDE LENGTH≠0 = break_box_extruder_
#                       retrude: Box bis Buffer, Extruder G0 E<x> F300, KEIN
#                       Box-Rückzug; Creality Print 7 schickt „M8200 R E-30“
#                       VOR dem Schnitt, README-k2_box.md §19)
#   M8200 L I<next>     einziehen + WASTE     -> KTWO_BOX_EXTRUDE TNN=T<I/4+1><ABCD>
#   M8200 W             Abfallschacht         -> KTWO_BOX_WASTE (nur Hinweis)
#   M8200 F [S..] [L..] spülen                -> KTWO_BOX_FLUSH TNN=<aus L>
#                       TOOL=<I aus L> (Index für flush_mode: matrix)
#   M8200 O [S<next>]   abschließen           -> KTWO_BOX_END_OPT RETURN=0
#                       (Rückfahrt + Z macht der Slicer, T0-Beispiel 13.)
# Abweichung vom Stock: "L" zählt NUR ohne "F" als Einzug (Stock-Kommentar
# "M8200 F S[speed]L[length]" würde im Stock-Makro sonst zusätzlich einen
# Einzug T1A auslösen). "I=3" wird wie "I3" gelesen.
[gcode_macro M8200]
description: Filamentwechsel Schritt für Schritt (aus Creality-Print-Dateien): P vorbereiten, C schneiden, R zurückziehen, L einziehen, F spülen, O abschließen
variable_tnn: ""
variable_tool: -1
gcode:
  {% if "k2_box" in printer and printer.k2_box.source == "extern" %}
    # Externe Spule: kein CFS-Befehl. Das Ziel-Werkzeug (P S<n> bzw. L I<n>)
    # prüft KTWO_BOX_EXTERN_TOOL (anderes Werkzeug im Druck -> PAUSE).
    {% if params.P is defined and params.S is defined and params.S|string|replace("=", "") != "" %}
      KTWO_BOX_EXTERN_TOOL T={params.S|string|replace("=", "")|int}
    {% elif params.L is defined and params.F is not defined %}
      KTWO_BOX_EXTERN_TOOL T={params.I|default(0)|string|replace("=", "")|int}
    {% else %}
      {action_respond_info("M8200 %s: Quelle EXTERN – übersprungen (kein CFS-Befehl)" % (params|join(" ")))}
    {% endif %}
  {% else %}
  {% if params.P is defined %}
    {% set s = params.S|default("")|string|replace("=", "") %}
    {% if s != "" %}
      {% set n = s|int %}
      KTWO_BOX_PRE_OPT Z_HOP=0 SOURCE=M8200 TNN={"T%d%s" % ((n // 4) + 1, "ABCD"[n % 4])}
    {% else %}
      KTWO_BOX_PRE_OPT Z_HOP=0 SOURCE=M8200
    {% endif %}
  {% endif %}
  {% if params.C is defined %}
    KTWO_BOX_CUT
  {% endif %}
  {% if params.R is defined %}
    {% set e = params.E|default(0)|string|replace("=", "")|float %}
    {% if e != 0 %}
      KTWO_BOX_BREAK_RETRUDE LENGTH={e}
    {% else %}
      KTWO_BOX_RETRUDE
    {% endif %}
  {% endif %}
  {% if params.L is defined and params.F is not defined %}
    {% set i = params.I|default(0)|string|replace("=", "")|int %}
    {% set tnn = "T%d%s" % ((i // 4) + 1, "ABCD"[i % 4]) %}
    {action_respond_info("tnn: %s" % tnn)}
    KTWO_BOX_EXTRUDE TNN={tnn}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='"{tnn}"'
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tool VALUE={i}
    KTWO_BOX_WASTE
  {% endif %}
  {% if params.W is defined %}
    KTWO_BOX_WASTE
  {% endif %}
  {% if params.F is defined %}
    {% set tnn = printer['gcode_macro M8200'].tnn %}
    {% set tool = printer['gcode_macro M8200'].tool|int %}
    {% if tnn and tool >= 0 %}
      KTWO_BOX_FLUSH TNN={tnn} TOOL={tool}
    {% elif tnn %}
      KTWO_BOX_FLUSH TNN={tnn}
    {% else %}
      KTWO_BOX_FLUSH
    {% endif %}
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tnn VALUE='""'
    SET_GCODE_VARIABLE MACRO=M8200 VARIABLE=tool VALUE=-1
  {% endif %}
  {% if params.O is defined %}
    KTWO_BOX_END_OPT RETURN=0
  {% endif %}
  {% endif %}

# M600 (Filamentwechsel-Pause aus der Druckdatei, z. B. Orca „Pause/
# Farbwechsel an Schicht“): Stock virtual_sdcard ersetzt die Zeile im
# Dateistrom durch PAUSE (VS:1228-1229,
# dort nur mit Power-Loss-Schalter). Upstream-Klipper kennt M600 nicht
# („Unknown command“, Zeile wird übersprungen) – daher dieses Makro; kein
# Konflikt mit Upstream (kein eingebautes M600, kein rename_existing).
# Ruft das PAUSE-Makro unten (Parken, 140 °C, RESUME wie gewohnt). Nur im
# laufenden Druck – von Hand außerhalb eines Drucks nur eine Meldung (kein
# Parken/Abkühlen). Parameter (Prusa B/X/Y/Z/E/L) werden ignoriert.
# ---------------------------------------------------------------------
[gcode_macro M600]
description: Pause für einen Filamentwechsel von Hand (nur während eines Drucks), danach weiter mit RESUME
gcode:
  {% if printer.print_stats.state == "printing" and not printer.pause_resume.is_paused %}
    {action_respond_info("M600: Filamentwechsel-Pause -> PAUSE (Wechsel von Hand, dann RESUME)")}
    PAUSE
  {% else %}
    {action_respond_info("M600 ignoriert: kein laufender Druck (Zustand %s)" % printer.print_stats.state)}
  {% endif %}

# ---------------------------------------------------------------------
# Externe Spule (Ersatz für Stock LOAD_MATERIAL*/QUIT_MATERIAL* aus
# gcode_macro.cfg + [filament_rack]). ENTWURF 19.10.2026, am Gerät
# UNGETESTET. Bedienung + Sperren: README-k2_box.md §18.
#
# Ablauf am Drucker: CFS-Filament entladen, Schlauch von Hand von der CFS auf
# die externe Spule umstecken -> SET_FILAMENT_SOURCE SOURCE=EXTERNAL -> Filament von Hand bis zur
# LED am Druckkopf schieben (Kopfsensor) -> LOAD_FILAMENT [MATERIAL=…]
# [TEMP=…]. Zurück: UNLOAD_FILAMENT, Filament herausziehen, Schlauch an die
# CFS -> SET_FILAMENT_SOURCE SOURCE=CFS. Bei Quelle EXTERN lehnt [k2_box] jede CFS-Aktion ab
# (nichts an die CFS gesendet); einzige Ausnahme wie Stock live: der Box-
# Druckzustand 0x0d [0f 00/01] + 0x0f [01/00] aus START_PRINT/END_PRINT.
# END_PRINT entlädt nicht. T<n>/M8200 aus der Druckdatei: erstes Werkzeug =
# kein Wechsel, ein anderes -> PAUSE.
# Material: ohne MATERIAL= das zuletzt gespeicherte externe Material (wie
# das Stock-Display); MATERIAL=<Name|Typ|ID> (mit Material-DB: z. B. PLA ->
# „Generic PLA“, „Hyper PLA“, 01001) bzw. TYPE=<id> setzt und speichert es
# neu, COLOR=RRGGBB (ohne #) die Farbe, TEMP=<°C> überschreibt die DB-
# Temperatur (Grenzen min_extrude_temp .. max_temp−10/[k2_safety]; beim
# Laden gespeichert, beim Entladen nur dieses Mal). Ohne Material-DB ist
# TEMP= beim ersten Laden Pflicht. Mit [k2_box] extern_rfid liest
# KTWO_EXTERN_RFID das Etikett (Auslöser !PA5, printer.cfg) und überschreibt
# das gespeicherte Material.
# Freigaben unverändert: [k2_box] allow_move (sonst nur PLAN) und
# _PI_FREIGABE allow_move (Bewegung). Kein Box-Frame, daher ohne allow_write.
# ---------------------------------------------------------------------
[gcode_macro SET_FILAMENT_SOURCE]
description: Filamentquelle wählen: SOURCE=CFS (Schlauch an der CFS) oder SOURCE=EXTERNAL (externe Spule, Schlauch von Hand umgesteckt – alle CFS-Aktionen gesperrt)
gcode:
  {% set src = params.SOURCE|default("")|upper %}
  {% if src in ["EXTERNAL", "EXTERN"] %}
    KTWO_BOX_SOURCE SOURCE=EXTERN
  {% elif src == "CFS" %}
    KTWO_BOX_SOURCE SOURCE=CFS
  {% else %}
    {action_raise_error("SET_FILAMENT_SOURCE: SOURCE=CFS oder SOURCE=EXTERNAL angeben")}
  {% endif %}

[gcode_macro SET_EXTERNAL_MATERIAL]
description: Material der externen Spule anzeigen oder setzen (MATERIAL=PLA, COLOR=RRGGBB, TEMP=°C, CLEAR=1 löscht)
gcode:
  KTWO_BOX_EXTERN_MATERIAL {rawparams}

# Stock LOAD_MATERIAL: SAVE_GCODE_STATE, Schacht (G28 X Y nur ohne
# Referenz), Lüfter sichern, Heizen + Spülen wie CFS-Wechsel, Lüfter zurück,
# Abkühlen (SET_COOL_TEMP), sichere Position, RESTORE_GCODE_STATE.
[gcode_macro LOAD_FILAMENT]
description: Externe Spule laden: Filament vorher von Hand bis zur LED am Druckkopf schieben, dann heizt und spült der Drucker (MATERIAL=…, TEMP=°C)
gcode:
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set fr = printer["gcode_macro _PI_FREIGABE"] if "gcode_macro _PI_FREIGABE" in printer else none %}
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if kb is none %}
    {action_raise_error("LOAD_FILAMENT: [k2_box] fehlt (k2-module.cfg) – nichts bewegt")}
  {% endif %}
  {% if kb.allow_move and (fr is none or not fr.allow_move) %}
    {action_raise_error("LOAD_FILAMENT gesperrt: _PI_FREIGABE allow_move=False (README §4) – nichts bewegt")}
  {% endif %}
  # Prüfungen (Quelle, Druck/Pause, Kopfsensor, Material/Temperatur) VOR
  # jeder Bewegung; Fehler -> Makro bricht ab
  KTWO_BOX_EXTERN_BEGIN OP=LADEN {rawparams}
  {% if kb.allow_move %}
    {% if "x" not in homed or "y" not in homed %}
      G28 X Y
    {% endif %}
    {% if "z" in homed and printer.gcode_move.gcode_position.z < p.nozzle_clean_z_min %}
      G90
      G1 Z{p.nozzle_clean_z_min} F{p.nozzle_clean_z_speed}
    {% endif %}
  {% endif %}
  KTWO_BOX_GO_EXTRUDE_POS
  _KTWO_FAN_SAVE
  KTWO_BOX_EXTERN_FLUSH
  KTWO_BOX_SAFE_POS
  KTWO_BOX_EXTERN_END
  _KTWO_FAN_RESTORE

# Stock QUIT_MATERIAL: SAVE_GCODE_STATE, Schacht, bei Kopfsensor Heizen,
# Schneiden, bei Kopfsensor E-10 F360, sichere Position, Abkühlen,
# RESTORE_GCODE_STATE. Pi: vor dem Schnitt erst aus dem Schacht (X160 ->
# Y345, wie PAUSE), nie schräg vom Schacht zum Schneidhebel.
[gcode_macro UNLOAD_FILAMENT]
description: Externe Spule entladen: heizen, Filament schneiden und etwas zurückziehen – danach von Hand herausziehen
gcode:
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set fr = printer["gcode_macro _PI_FREIGABE"] if "gcode_macro _PI_FREIGABE" in printer else none %}
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set homed = printer.toolhead.homed_axes %}
  {% if kb is none %}
    {action_raise_error("UNLOAD_FILAMENT: [k2_box] fehlt (k2-module.cfg) – nichts bewegt")}
  {% endif %}
  {% if kb.allow_move and (fr is none or not fr.allow_move) %}
    {action_raise_error("UNLOAD_FILAMENT gesperrt: _PI_FREIGABE allow_move=False (README §4) – nichts bewegt")}
  {% endif %}
  KTWO_BOX_EXTERN_BEGIN OP=ENTLADEN {rawparams}
  {% if kb.allow_move %}
    {% if "x" not in homed or "y" not in homed %}
      G28 X Y
    {% endif %}
    {% if "z" in homed and printer.gcode_move.gcode_position.z < p.nozzle_clean_z_min %}
      G90
      G1 Z{p.nozzle_clean_z_min} F{p.nozzle_clean_z_speed}
    {% endif %}
  {% endif %}
  KTWO_BOX_GO_EXTRUDE_POS
  KTWO_BOX_EXTERN_HEAT
  KTWO_BOX_SAFE_POS
  KTWO_BOX_CUT
  KTWO_BOX_EXTERN_RETRACT
  KTWO_BOX_SAFE_POS
  KTWO_BOX_EXTERN_END
  {% if kb.allow_move %}
    # Live 26.10.2026: Der bestromte Closed-Loop-Extruder hält seine Position
    # – das abgeschnittene Filament ließ sich erst nach dem Freigeben von Hand
    # herausziehen. Nur der Extruder (eigene Freigabeleitung); X/Y/Z bleiben
    # bestromt (Bett sackt nicht ab). Beim nächsten Extrudieren schaltet
    # Klipper ihn wieder ein.
    SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
    _PI_MELDUNG MSG="UNLOAD_FILAMENT: Extruder-Motor freigegeben – Filament jetzt von Hand herausziehen."
  {% endif %}

# ---------------------------------------------------------------------
# Druckstart mit Dateiprüfung (k2_dateipruefung.py, README-k2_dateipruefung.md)
# Vorfall 23.10.2026: Eine Datei mit Bambu-Lab-Druckerprofil (Orca hatte das
# Profil einer geöffneten MakerWorld-3MF übernommen) lief mit Bambu-Startcode
# an. KTWO_DATEI_PRUEFEN lehnt Dateien mit fremdem printer_model bzw. mit
# Bambu-Befehlen ab; der Fehler bricht dieses Makro ab, BEVOR
# SDCARD_PRINT_FILE_BASE die Datei öffnet.
# FILENAME: Moonraker/Mainsail senden SDCARD_PRINT_FILE FILENAME="<pfad>"
# (Anführungszeichen im Namen als \"). rawparams ist der Parameterteil genau
# wie empfangen (samt Anführungszeichen) und geht UNVERÄNDERT an beide
# Befehle – beide zerlegen ihn mit demselben Klipper-Parser (shlex) wie das
# Original, Leerzeichen/Umlaute/Anführungszeichen kommen identisch an.
# Auch KTWO_RESUME_PREPARE START=1 (PRINT_FROM_LAYER) startet über dieses
# Makro. M23/M24 (Datei wählen + starten) umgehen die Prüfung.
# ---------------------------------------------------------------------
[gcode_macro SDCARD_PRINT_FILE]
rename_existing: SDCARD_PRINT_FILE_BASE
description: Druckdatei prüfen (passt das Druckerprofil?) und Druck starten
gcode:
  {% if "k2_dateipruefung" in printer %}
    KTWO_DATEI_PRUEFEN {rawparams}
  {% else %}
    {action_respond_info("SDCARD_PRINT_FILE: [k2_dateipruefung] nicht geladen – Datei NICHT geprüft")}
  {% endif %}
  SDCARD_PRINT_FILE_BASE {rawparams}

# ---------------------------------------------------------------------
# Druckstart / -ende (Gerüst, Ablauf angelehnt an Stock-START_PRINT)
# Slicer (Creality Print): START_PRINT EXTRUDER_TEMP=.. BED_TEMP=..
# ---------------------------------------------------------------------
[gcode_macro START_PRINT]
description: Druckstart: heizen, Referenzfahrt, Bett unter den Objekten vermessen, auf Drucktemperatur (ADAPTIVE=0: gespeichertes Mesh laden)
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  # EXTRUDER=/BED= (PRINT_START allgemeiner Klipper-Profile, z. B. Orca
  # „MyKlipper“) gelten wie EXTRUDER_TEMP=/BED_TEMP= (23.10.2026)
  {% set BED_TEMP = params.BED_TEMP|default(params.BED|default(p.default_bed_temp))|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(params.EXTRUDER|default(p.default_extruder_temp))|float %}
  {% set PROBE_TEMP = p.g28_ext_temp|float %}
  G90
  SET_GCODE_OFFSET Z=0
  CLEAR_PAUSE
  # CFS-Druckzustand wie Stock BOX_START_PRINT (A2, README-k2_box.md §16,
  # live beim Dateistart): 0x0d [0f 00] + 0x0f [01] gilt den ganzen
  # Druck, der Einzug (T<n>) schaltet 0x0f dann nicht um. Nur mit Freigabe;
  # Fehler meldet k2_box nur (Druck läuft weiter). Ende: END_PRINT.
  # Setzt zugleich einen Wechsel-Fehlerzustand eines früheren Drucks zurück
  # (C3, README-k2_box.md §17; Rückfall, falls CANCEL_PRINT
  # ihn nicht erreicht hat). Ohne Freigabe nur das Zurücksetzen.
  {% if "k2_box" in printer and printer.k2_box.change_enabled %}
    KTWO_BOX_PRINT_START
  {% elif "k2_box" in printer %}
    KTWO_BOX_CANCEL_RESET START=1
  {% endif %}
  M107
  M140 S{BED_TEMP}
  M104 S{PROBE_TEMP}
  G28
  M190 S{BED_TEMP}
  M109 S{PROBE_TEMP}
  # Stock START_PRINT (gcode_macro.cfg:516-523): NOZZLE_CLEAR, M109 140,
  # BOX_NOZZLE_CLEAN, NEXT_HOMEZ_NACCU, G28 Z. Hier: Silikonstreifen-
  # Reinigung bei 140 °C, dann zweites Z-Antasten mit warmem Bett (Stock
  # "精归零"). NOZZLE_CLEAR (Düse aufs Bett drücken/abkühlen/abziehen,
  # prth_clr_*) und NEXT_HOMEZ_NACCU bewusst NICHT (README.md §7.2).
  _PI_NOZZLE_CLEAN WHY=START_PRINT
  # A10a (17.10.2026, README.md §7.7): Nach Stromlos (Einschalten,
  # M84, FIRMWARE_RESTART, Not-Aus) ist die Dual-Z-Schräglage unbekannt –
  # Stock gleicht das beim ersten G28 Z über die Lichtschranken aus, wir
  # nicht. Daher Z_TILT_ADJUST, solange z_tilt nicht "applied" ist (Upstream
  # setzt applied bei Start/motor_off zurück); danach das maßgebliche G28 Z.
  _PI_ZTILT_WENN_NOETIG
  G28 Z
  # ADAPTIVE (Standard 1 seit 23.10.2026 – Slicer übergeben den Parameter
  # nicht, vorher lief beim Druckstart gar kein Mesh): Mesh nur über den
  # Objekten (EXCLUDE_OBJECT_DEFINE aus dem Slicer, „Objekte beschriften“;
  # ohne Objekte misst Klipper das ganze Bett), eigenes Profil „adaptiv“ –
  # das gespeicherte „default“ bleibt unberührt. ADAPTIVE=0 lädt „default“.
  # 25.10.2026: Creality Print schreibt kein EXCLUDE_OBJECT_DEFINE -> Klipper
  # maß trotz ADAPTIVE=1 jedes Mal das ganze Bett; jetzt über
  # _PI_MESH_DRUCKBEREICH mit PRINT_MIN/PRINT_MAX des Slicers.
  {% set bereich = ("PRINT_MIN=" ~ params.PRINT_MIN ~ " PRINT_MAX=" ~ params.PRINT_MAX)
                   if params.PRINT_MIN and params.PRINT_MAX else "" %}
  SET_GCODE_VARIABLE MACRO=_PI_MESH_STATUS VARIABLE=druck_mesh VALUE=0
  {% if params.ADAPTIVE|default(1)|int %}
    _PI_MESH_DRUCKBEREICH {bereich}
  {% else %}
    _PI_MESH_LADEN
  {% endif %}
  # Merker: weitere BED_MESH_CALIBRATE aus der Druckdatei überspringen
  SET_GCODE_VARIABLE MACRO=_PI_MESH_STATUS VARIABLE=druck_mesh VALUE=1
  # Stock (gcode_macro.cfg:529-538): über dem Abfallschacht auf
  # Drucktemperatur (Tropfen fallen in den Schacht), dann abstreifen.
  _PI_NOZZLE_CLEAN ONLY=GO WHY=START_PRINT-Heizen
  M104 S{EXTRUDER_TEMP}
  M109 S{EXTRUDER_TEMP}
  _PI_NOZZLE_CLEAN WHY=START_PRINT-Ende
  M220 S100
  M221 S100
  G21
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=10
  M204 S5000
  G92 E0
  SET_PIN PIN=extruder_fan VALUE=1

# Eigenes Makro, damit z_tilt.applied erst NACH dem Homing ausgewertet wird
# (Jinja rendert ein Makro komplett, bevor seine Befehle laufen).
[gcode_macro _PI_ZTILT_WENN_NOETIG]
gcode:
  {% if printer.z_tilt.applied %}
    {action_respond_info("START_PRINT: z_tilt seit dem letzten Stromlos bereits ausgeglichen – kein Z_TILT_ADJUST")}
  {% else %}
    Z_TILT_ADJUST
  {% endif %}

# Merker für die Hülle um BED_MESH_CALIBRATE: 1 = START_PRINT hat für diesen
# Druck schon vermessen (bzw. das Profil geladen). END_PRINT setzt zurück.
[gcode_macro _PI_MESH_STATUS]
variable_druck_mesh: 0
gcode:

# Creality Print schreibt nach START_PRINT selbst noch „BED_MESH_CALIBRATE
# ADAPTIVE=1“ in die Datei; ohne Objekte maß Klipper damit ein zweites Mal das
# ganze Bett, mit heißer Düse (25.10.2026). Läuft ein Druck und START_PRINT
# hat schon vermessen, wird der Aufruf übersprungen (Profil „adaptiv“ bleibt).
# Sonst unverändert durchgereicht. Die Hülle von [k2_nozzle_tempcomp]
# (Referenz beim Vermessen) liegt darunter (k2-module.cfg wird vor macros.cfg
# geladen) und läuft beim Überspringen nicht mit.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: _BED_MESH_CALIBRATE_BASE
description: Bett vermessen (im Druck übersprungen, wenn START_PRINT schon im Druckbereich vermessen hat)
gcode:
  {% set druck = printer.print_stats.state in ["printing", "paused"] %}
  {% if druck and printer["gcode_macro _PI_MESH_STATUS"].druck_mesh|int == 1 %}
    {action_respond_info("BED_MESH_CALIBRATE %s aus der Druckdatei übersprungen – START_PRINT hat das Bett schon im Druckbereich vermessen"
                         % rawparams)}
  {% else %}
    _BED_MESH_CALIBRATE_BASE {rawparams}
  {% endif %}

# Bett nur unter dem Druck vermessen (25.10.2026). Klippers ADAPTIVE=1 braucht
# EXCLUDE_OBJECT_DEFINE in der Datei; ohne Objekte misst es das ganze Bett
# (9 × 9, ca. 2 min). Reihenfolge: Objekte vorhanden -> ADAPTIVE=1; sonst der
# Bereich aus PRINT_MIN/PRINT_MAX des Slicers (+ RAND, Punktabstand wie im
# vollen Mesh, mindestens 3 × 3); ohne beides -> ganzes Bett wie bisher.
[gcode_macro _PI_MESH_DRUCKBEREICH]
description: Bett nur unter dem Druck vermessen (Objekte bzw. PRINT_MIN/PRINT_MAX), sonst das ganze Bett
gcode:
  {% set RAND = 10.0 %}
  {% set MIN_GROESSE = 20.0 %}
  {% set bm = printer.configfile.settings.bed_mesh %}
  {% set lo = bm.mesh_min if bm.mesh_min is not string else bm.mesh_min.split(",")|map("float")|list %}
  {% set hi = bm.mesh_max if bm.mesh_max is not string else bm.mesh_max.split(",")|map("float")|list %}
  {% set pc = bm.probe_count if bm.probe_count is not string else bm.probe_count.split(",")|map("int")|list %}
  {% set pc = pc if pc is not number else [pc, pc] %}
  {% set objekte = printer.exclude_object.objects|length if "exclude_object" in printer else 0 %}
  {% if objekte > 0 %}
    {action_respond_info("START_PRINT: Bett nur unter %d Objekt(en) vermessen (ADAPTIVE)" % objekte)}
    BED_MESH_CALIBRATE ADAPTIVE=1 PROFILE=adaptiv
  {% elif params.PRINT_MIN and params.PRINT_MAX %}
    {% set mn = params.PRINT_MIN.split(",")|map("float")|list %}
    {% set mx = params.PRINT_MAX.split(",")|map("float")|list %}
    {% set ns = namespace(a=[], b=[], n=[]) %}
    {% for i in range(2) %}
      {% set a = [lo[i], mn[i] - RAND]|max %}
      {% set b = [hi[i], mx[i] + RAND]|min %}
      {% if b - a < MIN_GROESSE %}
        {% set m = [[(a + b) / 2, lo[i] + MIN_GROESSE / 2]|max, hi[i] - MIN_GROESSE / 2]|min %}
        {% set a = m - MIN_GROESSE / 2 %}
        {% set b = m + MIN_GROESSE / 2 %}
      {% endif %}
      {% set abst = (hi[i] - lo[i]) / (pc[i] - 1) %}
      {% set n = [[((b - a) / abst)|round(0, 'ceil')|int + 1, 3]|max, pc[i]]|min %}
      {% set ns.a = ns.a + [a] %}
      {% set ns.b = ns.b + [b] %}
      {% set ns.n = ns.n + [n] %}
    {% endfor %}
    {% set nx, ny = ns.n[0], ns.n[1] %}
    # bicubic braucht >= 4 Punkte je Achse, lagrange höchstens 6
    {% if [nx, ny]|min >= 4 %}
      {% set alg = "bicubic" %}
    {% elif [nx, ny]|max <= 6 %}
      {% set alg = "lagrange" %}
    {% else %}
      {% set nx, ny = [nx, 4]|max, [ny, 4]|max %}
      {% set alg = "bicubic" %}
    {% endif %}
    {action_respond_info("START_PRINT: Bett nur im Druckbereich vermessen: X %.1f–%.1f, Y %.1f–%.1f (%d × %d Punkte statt %d × %d)"
                         % (ns.a[0], ns.b[0], ns.a[1], ns.b[1], nx, ny, pc[0], pc[1]))}
    BED_MESH_CALIBRATE PROFILE=adaptiv MESH_MIN={"%.1f,%.1f" % (ns.a[0], ns.a[1])} MESH_MAX={"%.1f,%.1f" % (ns.b[0], ns.b[1])} PROBE_COUNT={nx},{ny} ALGORITHM={alg}
  {% else %}
    {action_respond_info("START_PRINT: keine Objekte und kein PRINT_MIN/PRINT_MAX – ganzes Bett vermessen")}
    BED_MESH_CALIBRATE PROFILE=adaptiv
  {% endif %}

# Eigenes Makro, damit die Prüfung erst NACH dem Homing ausgewertet wird
# (Jinja rendert ein Makro komplett, bevor seine Befehle laufen).
[gcode_macro _PI_MESH_LADEN]
gcode:
  {% if 'default' in printer.bed_mesh.profiles %}
    BED_MESH_PROFILE LOAD=default
  {% else %}
    {action_respond_info("START_PRINT: kein Mesh-Profil 'default' – ohne Mesh (G29 ausführen)")}
  {% endif %}

[gcode_macro PRINT_START]
description: Anderer Name für START_PRINT (für Slicer-Profile)
gcode:
  START_PRINT {rawparams}

[gcode_macro END_PRINT]
description: Druckende: Düse anheben, Filament schneiden und in die CFS zurückziehen, Heizungen und Lüfter aus
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set cancel = params.CANCEL|default(0)|int %}
  SET_GCODE_VARIABLE MACRO=_PI_MESH_STATUS VARIABLE=druck_mesh VALUE=0
  M400
  G92 E0
  # Reihenfolge wie Stock (A6, README-k2_box.md §16): erst NUR
  # Z +2 (Stock END_PRINT_Z_SAFE "G1 Z2.0 F600"), dann entladen (Schacht,
  # Schnitt, Rückzug in die Box), DANACH Extruder-Rückzug und Z-Hub auf
  # max_z/2 (_PI_END_PARK; vorher wurde 3 mm VOR dem Schnitt zurückgezogen).
  # Die Fahrt in den Schacht läuft 2 mm über der letzten Schicht (höher
  # ragt kein Teil); X/Y-Grenzen weitet k2_box nur für den Schachtschritt
  # ([k2_limits]), Z bleibt <= max_z (350, k2_limits 350,2).
  # Grenze wie Stock END_PRINT_Z_SAFE: nur unter max_z - 5 (C6,
  # README-k2_box.md §17; vorher max_z - 2).
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < p.max_z_position|float - 5 %}
      G91
      G1 Z2 F600
      G90
    {% endif %}
  {% endif %}
  # CFS am Druckende (= Stock BOX_END, README-k2_box.md §12.5): mit
  # [k2_box] end_print_unload (Default AN wie Stock: heizen, schneiden, in
  # die Box zurück) ODER offenem Restmaterial-Fall (Spule im Druck leer ->
  # Rest ausspülen, ending_material_purge) – nur mit beiden Freigaben und
  # referenzierten Achsen. Vor TURN_OFF_HEATERS (Düse noch heiß). Kein
  # Spülen am Druckende. Fehler meldet k2_box nur (keine Pause), END_PRINT
  # läuft weiter. CANCEL=1 (aus CANCEL_PRINT, C3): offener Wechsel-Fehler
  # aus der Pause -> trotzdem entladen, wenn sicher (Kopfsensor meldet
  # Filament, Fehler nur beim Einzug/Spülen), sonst nur Meldung; der
  # Fehlerzustand selbst bleibt bis nach CANCEL_PRINT_BASE.
  {% if "k2_box" in printer and printer.k2_box.change_enabled
        and (printer.k2_box.end_print_unload or printer.k2_box.ending_material)
        and "xyz" in printer.toolhead.homed_axes %}
    KTWO_BOX_END_PRINT{" CANCEL=1" if cancel else ""}
  {% endif %}
  # Box-Druckzustand zurück wie Stock BOX_END_PRINT (A2, live nach dem
  # Rückzug): 0x0d [0f 01] + 0x0f [00]. Ohne Achsen-Bedingung (nur Box).
  {% if "k2_box" in printer and printer.k2_box.change_enabled %}
    KTWO_BOX_PRINT_END
  {% endif %}
  _PI_END_PARK
  # (Stock EXCLUDE_OBJECT_RESET ist Creality – Upstream setzt exclude_object
  #  beim Datei-Reset von virtual_sdcard selbst zurück)
  M220 S100
  M221 S100
  # FORCE=1: END_PRINT läuft noch im Zustand „printing“ (Schutz unten)
  TURN_OFF_HEATERS FORCE=1
  M141 S0
  M107 P1
  M107 P2
  SET_PIN PIN=extruder_fan VALUE=0
  # Stock WAIT_TEMP_START (Bauteillüfter voll) und gleich danach
  # M106 P0 S127 (C5, README-k2_box.md §17, Stock-
  # END_PRINT): ≈ 55 % bis Düse < 40 °C (_wait_temp schaltet dann aus).
  _WAIT_TEMP_START
  M106 P0 S127
  # Kein M84: Stock schaltet die Motoren am Druckende nicht ab (Bett hält
  # Position) – ANNAHME, s. [idle_timeout].

# Eigenes Makro, damit Position/can_extrude erst NACH Z+2 und dem Entladen
# ausgewertet werden (Jinja rendert ein Makro komplett, bevor seine Befehle
# laufen). Stock END_PRINT_POINT: Z auf ~max_z/2 (live 172,96).
[gcode_macro _PI_END_PARK]
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    M400
    G92 E0
    G91
    {% if printer.extruder.can_extrude %}
      G1 E-1.0 F180
      G1 E-{p.pause_extrude} F4000
    {% endif %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set max_z = p.max_z_position|float %}
    {% if act_z < max_z / 2 %}
      G1 Z{max_z / 2 - act_z} F600
    {% endif %}
    G90
  {% endif %}

[gcode_macro PRINT_END]
description: Anderer Name für END_PRINT (für Slicer-Profile)
gcode:
  END_PRINT

[delayed_gcode _wait_temp]
gcode:
  {% if printer.extruder.temperature|int < 40 %}
    _WAIT_TEMP_END
  {% else %}
    UPDATE_DELAYED_GCODE ID=_wait_temp DURATION=5
  {% endif %}

[gcode_macro _WAIT_TEMP_START]
gcode:
  M106 P0 S255
  UPDATE_DELAYED_GCODE ID=_wait_temp DURATION=1

[gcode_macro _WAIT_TEMP_END]
gcode:
  UPDATE_DELAYED_GCODE ID=_wait_temp DURATION=0
  M107 P0

# ---------------------------------------------------------------------
# Düsenreinigung am Silikonstreifen (Ersatz für Stock BOX_NOZZLE_CLEAN)
# ENTWURF 16.10.2026, am Gerät UNGETESTET. Bedienung/ANNAHMEN:
# README.md §7.2. Aufrufe: homing.cfg (vor dem ersten
# Z-Antasten, Stock sensorless.cfg:198-204), START_PRINT und G29 (vor dem
# zweiten G28 Z), RESUME (nach der Vorextrusion), START_PRINT-Ende.
#
# Bahn = Stock-T0-Beispiel (box.cfg) Schritt 6 + 10.1-10.3 + 11:
#   Schacht     Y345 -> X139 -> Y378 -> X133           KTWO_BOX_GO_EXTRUDE_POS
#   Abstreifen  Blech X160 -> X135 (Y378), Kreis am Silikon um 164|374
#               (G2 I4) und 166|374 (G3 I-4), 3x Schütteln X160 <-> X133
#                                                      KTWO_BOX_WIPE
#   verlassen   X160 -> Y345                           KTWO_BOX_SAFE_POS
# Alle Positionen aus [k2_box] (k2-module.cfg) – eine Quelle.
#
# Weg VIA=BOX = die KTWO_BOX_*-Schritte (Wiederverwendung). Im laufenden
# Druck (print_stats printing/paused) verlangt k2_box für JEDEN Schritt
# allow_write UND allow_move und PAUSIERT sonst (+ chain_error, RESUME
# gesperrt) – für eine reine Kopfbewegung reicht aber allow_move. Deshalb
# im Druck ohne volle CFS-Freigabe (oder bei offener Wechselkette)
# VIA=GCODE: dieselbe Bahn als G-Code aus denselben [k2_box]-Werten
# (_PI_CLEAN_PATH, Batch: Bahn identisch). Kein Heizen, kein Extrudieren.
#
# Freigaben: _PI_FREIGABE allow_move UND [k2_box] allow_move, X/Y
# referenziert – sonst nur Meldung (nie Fehler, nie Shutdown). Z: ist Z
# referenziert und < nozzle_clean_z_min, erst anheben; ist Z noch NICHT
# referenziert (erstes G28), nur X/Y wie Stock (beim K2 fährt das Bett in
# Z, Schacht und Silikon sitzen am Rahmen).
# Parameter: ONLY=GO (nur in den Schacht, z. B. zum Aufheizen), LEAVE=0
# (nach dem Abstreifen im Schacht bleiben), VIA=AUTO|BOX|GCODE, WHY=<Text>.
# ---------------------------------------------------------------------
[gcode_macro _PI_NOZZLE_CLEAN]
description: Düse am Silikonstreifen reinigen (Stock BOX_NOZZLE_CLEAN) [ONLY=GO] [LEAVE=0] [VIA=AUTO|BOX|GCODE]
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set fr = printer["gcode_macro _PI_FREIGABE"] %}
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set why = params.WHY|default("")|string %}
  {% set tag = "_PI_NOZZLE_CLEAN" ~ ((" [" ~ why ~ "]") if why else "") %}
  {% set only = params.ONLY|default("")|string|upper %}
  {% set leave = params.LEAVE|default(1)|int %}
  {% set reason = "" %}
  # Unbekanntes ONLY (z. B. Tippfehler "GO.") nicht als volle Reinigung
  # ausführen, sondern abbrechen (25.10.2026)
  {% if only not in ["", "GO"] %}
    {action_raise_error("%s: unbekannter Wert ONLY=%s (erlaubt: ONLY=GO oder weglassen) – keine Bewegung." % (tag, params.ONLY))}
  {% endif %}
  {% if not p.nozzle_clean_enable %}
    {% set reason = "abgeschaltet (_PI_PARAM nozzle_clean_enable=False)" %}
  {% elif not fr.allow_move %}
    {% set reason = "_PI_FREIGABE allow_move=False" %}
  {% elif kb is none %}
    {% set reason = "[k2_box] fehlt (Schacht-/Silikon-Positionen)" %}
  {% elif not kb.allow_move %}
    {% set reason = "[k2_box] allow_move=False" %}
  {% elif "x" not in homed or "y" not in homed %}
    {% set reason = "X/Y nicht referenziert" %}
  {% endif %}
  {% if reason %}
    {action_respond_info("%s übersprungen: %s – keine Bewegung." % (tag, reason))}
  {% else %}
    {% set state = printer.print_stats.state if "print_stats" in printer else "standby" %}
    {% set paused = printer.pause_resume.is_paused %}
    {% set active = state in ["printing", "paused"] or paused %}
    {% if paused and state != "paused" %}
      {% set state = state ~ "+pausiert" %}
    {% endif %}
    {% set via = params.VIA|default("AUTO")|string|upper %}
    {% if via != "BOX" and via != "GCODE" %}
      # "active" wie k2_box _print_active(): print_stats printing/paused
      # ODER pause_resume.is_paused – dort verlangt k2_box beide Freigaben
      {% if (active and not kb.change_enabled) or kb.chain_active %}
        {% set via = "GCODE" %}
      {% else %}
        {% set via = "BOX" %}
      {% endif %}
    {% endif %}
    {% set what = "Schacht" if only == "GO" else ("Schacht -> Silikon -> raus" if leave else "Schacht -> Silikon") %}
    {% set acc = printer.toolhead.max_accel %}
    {action_respond_info("%s: %s über %s (Druckzustand %s)" % (tag, what, via, state))}
    SAVE_GCODE_STATE NAME=_pi_nozzle_clean
    G90
    {% if "z" in homed and printer.gcode_move.gcode_position.z < p.nozzle_clean_z_min %}
      G1 Z{p.nozzle_clean_z_min} F{p.nozzle_clean_z_speed}
    {% endif %}
    M204 S{p.nozzle_clean_accel}
    {% if via == "BOX" %}
      KTWO_BOX_GO_EXTRUDE_POS
      {% if only != "GO" %}
        KTWO_BOX_WIPE
        {% if leave %}
          KTWO_BOX_SAFE_POS
        {% endif %}
      {% endif %}
    {% else %}
      _PI_CLEAN_PATH PART=GO
      {% if only != "GO" %}
        _PI_CLEAN_PATH PART=WIPE
        {% if leave %}
          _PI_CLEAN_PATH PART=LEAVE
        {% endif %}
      {% endif %}
    {% endif %}
    M204 S{acc}
    RESTORE_GCODE_STATE NAME=_pi_nozzle_clean
  {% endif %}

# Dieselbe Bahn wie k2_box gcode_go_extrude_pos / gcode_wipe /
# gcode_safe_pos als reiner G-Code (Werte aus [k2_box], Defaults =
# k2_box CHANGE_DEFAULTS). Kreise als 16-Eck wie k2_box gcode_circle
# (Upstream-gcode_arcs kennt das Stock-"P1" nicht). Nur über
# _PI_NOZZLE_CLEAN aufrufen (dort Freigaben + Zustand).
[gcode_macro _PI_CLEAN_PATH]
description: Schacht-/Abstreif-Bahn als G-Code (PART=GO|WIPE|LEAVE), nur über _PI_NOZZLE_CLEAN
gcode:
  {% set cfg = printer.configfile.config %}
  {% set c = cfg["k2_box"] if "k2_box" in cfg else {} %}
  {% set part = params.PART|default("WIPE")|string|upper %}
  {% set tv = (c.travel_velocity|default(12000))|float %}
  {% set sy = (c.safe_pos_y|default(345))|float %}
  {% set enx = (c.extrude_entry_pos_x|default(139))|float %}
  {% set ex = (c.extrude_pos_x|default(133))|float %}
  {% set ey = (c.extrude_pos_y|default(378))|float %}
  {% set clx = (c.clean_left_pos_x|default(135))|float %}
  {% set crx = (c.clean_right_pos_x|default(160))|float %}
  {% set cry = (c.clean_right_pos_y|default(378))|float %}
  {% set cv = (c.clean_velocity|default(12000))|float %}
  {% set plx = (c.clean_pos_left_x|default(160))|float %}
  {% set prx = (c.clean_pos_right_x|default(170))|float %}
  {% set my = (c.clean_pos_middle_y|default(374))|float %}
  {% set r = (c.wipe_circle_radius|default(4))|float %}
  {% set wv = (c.wipe_circle_velocity|default(10000))|float %}
  {% set wa = (c.wipe_accel|default(5000))|float %}
  {% set shakes = (c.wipe_shakes|default(3))|int %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set cs = [0.92388, 0.70711, 0.38268, 0.0, -0.38268, -0.70711, -0.92388, -1.0, -0.92388, -0.70711, -0.38268, 0.0, 0.38268, 0.70711, 0.92388, 1.0] %}
  {% set sn = [0.38268, 0.70711, 0.92388, 1.0, 0.92388, 0.70711, 0.38268, 0.0, -0.38268, -0.70711, -0.92388, -1.0, -0.92388, -0.70711, -0.38268, 0.0] %}
  # L3 (18.10.2026): Schacht/Silikon liegen außerhalb des Betriebsfensters
  # (Y > 352) -> Fahrgrenzen nur für GO/WIPE aufweiten (Stock SET_LIMITS,
  # [k2_limits]); KTWO_LIMITS_RESTORE am Ende des Teils. Bricht eine Fahrt
  # ab, setzt [k2_limits] beim G-Code-Fehler selbst zurück. LEAVE (X160 nur
  # X, dann Y345) führt ins Fenster und braucht keine Aufweitung.
  {% set lim = "k2_limits" in printer %}
  G90
  {% if part == "GO" %}
    {% if (pos.x - ex)|abs >= 0.5 or (pos.y - ey)|abs >= 0.5 %}
      {% if lim %}
        KTWO_LIMITS_WIDE REASON=Schacht
      {% endif %}
      {% if pos.x < (c.pre_cut_pos_x|default(10))|float - 0.01 %}
        # Kopf am Schneidhebel: erst NUR X heraus + Halt (wie k2_box
        # gcode_leave_cut_zone, Stock box.cfg:13 / Schnitt-Rückweg G0 X10)
        G0 X{(c.pre_cut_pos_x|default(10))|float} F{tv}
        M400
      {% endif %}
      G0 Y{sy} F{tv}
      G0 X{enx} F{tv}
      G0 Y{ey} F{tv}
      G0 X{ex} F{tv}
      {% if lim %}
        KTWO_LIMITS_RESTORE
      {% endif %}
    {% endif %}
  {% elif part == "WIPE" %}
    {% set acc = printer.toolhead.max_accel %}
    {% if lim %}
      KTWO_LIMITS_WIDE REASON=Abstreifen
    {% endif %}
    SET_VELOCITY_LIMIT ACCEL={wa}
    G0 X{crx} F{cv}
    G0 X{clx} F{cv}
    G0 X{plx} Y{my} F{cv}
    {% for i in range(16) %}
      G1 X{"%.3f" % (plx + r - r * cs[i])} Y{"%.3f" % (my + r * sn[i])} F{wv}
    {% endfor %}
    G0 X{prx} Y{my} F{cv}
    {% for i in range(16) %}
      G1 X{"%.3f" % (prx - r + r * cs[i])} Y{"%.3f" % (my + r * sn[i])} F{wv}
    {% endfor %}
    {% for i in range(shakes) %}
      G0 X{crx} Y{cry} F{cv}
      G0 X{ex} Y{ey} F{cv}
    {% endfor %}
    SET_VELOCITY_LIMIT ACCEL={acc}
    {% if lim %}
      KTWO_LIMITS_RESTORE
    {% endif %}
  {% elif part == "LEAVE" %}
    G0 X{crx} F{tv}
    G0 Y{sy} F{tv}
  {% endif %}

# ---------------------------------------------------------------------
# Pause / Fortsetzen / Abbrechen
# PAUSE: Stock-Logik (z_safe, 140 °C, Parken X max-10 / Y Mitte) + merkt
# die Pausenposition. RESUME (Stock RESUME_EXTERNAL, ENTWURF 16.10.2026,
# am Gerät UNGETESTET, README.md §7.2): Abfallschacht ->
# Aufheizen -> Vorextrusion -> Abkühlen -> Abstreifen -> Schacht verlassen
# -> X/Y in Pausenhöhe zur Pausenposition -> Z senkrecht auf Pausenhöhe ->
# RESUME_BASE (Upstream stellt PAUSE_STATE mit MOVE=1 her = dann nur noch
# Nullfahrt + E-Basis) -> KTWO_BOX_RESUME_FIX (Z-Hop nach CFS-Abbruch).
# Abbruch eines CFS-Wechsels im Druck (ENTWURF 17.10.2026, README.md
# §7.2): Rückfahrziel = Druckposition VOR dem Wechsel (PAUSE
# CFS_RETURN_*), PAUSE verlässt Schneidbereich (nur X) bzw. Schacht (X160 ->
# Y345) vor dem Parken, RESUME ebenso vor jeder anderen Fahrt und setzt nach
# der Rückfahrt PAUSE_STATE neu (_PI_RESUME_REBASE). Ohne Bewegungsfreigabe,
# bei Ziel am Schneidhebel oder offenem chain_error: RESUME verweigert.
# Nach einem abgebrochenen CFS-Wechsel (ENTWURF 17.10.2026 spät,
# README.md §7.2): KTWO_BOX_RESUME_CHECK VOR jeder Bewegung –
# Kopf-Filamentsensor leer -> RESUME verweigert (Druck bleibt pausiert;
# T<n> in der Pause, dann RESUME) bzw. mit [k2_box] resume_redo_change
# (Default AUS) Wechsel nachholen wie Stock error_resume_process.
# ---------------------------------------------------------------------
[gcode_macro PAUSE]
description: Druck pausieren: Düse anheben, parken und auf 140 °C absenken – weiter mit RESUME
rename_existing: PAUSE_BASE
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% if not printer.pause_resume.is_paused %}
    {% set gp = printer.gcode_move.gcode_position %}
    {% set cfg = printer.configfile.config %}
    {% set c = cfg["k2_box"] if "k2_box" in cfg else {} %}
    {% set pcx = (c.pre_cut_pos_x|default(10))|float %}
    {% set sy = (c.safe_pos_y|default(345))|float %}
    {% set crx = (c.clean_right_pos_x|default(160))|float %}
    {% set tv = (c.travel_velocity|default(12000))|float %}
    # Abbruch eines CFS-Wechsels im laufenden Druck: k2_box übergibt die
    # Druckposition VOR dem Wechsel (Z ohne Hop) als Rückfahrziel – die
    # Fehlerposition (Schneidhebel/Schacht) bleibt nur in PAUSE_STATE.
    {% set cfs = params.CFS_RETURN_X is defined and params.CFS_RETURN_Y is defined and params.CFS_RETURN_Z is defined %}
    {% set rx = params.CFS_RETURN_X|float if cfs else gp.x %}
    {% set ry = params.CFS_RETURN_Y|float if cfs else gp.y %}
    {% set rz = params.CFS_RETURN_Z|float if cfs else gp.z %}
    # Temperatur für RESUME: wie Stock PAUSE_EXTERNAL das aktuelle Ziel
    # (Stock-gcode_macro.cfg; RESUME_EXTERNAL heizt
    # darauf) – außer k2_box übergibt nach einem
    # abgebrochenen Wechsel, der schon auf die Wechsel-Temperatur
    # (max(Ziel, Material-/Tn_extrude_temp)) geheizt hatte, das Druck-Ziel
    # VOR dem Aufheizen (CFS_TEMP; 0/ungültig -> aktuelles Ziel).
    # (README.md §7.2)
    {% set ctemp = params.CFS_TEMP|float if params.CFS_TEMP is defined else 0.0 %}
    {% set htemp = ctemp if ctemp > 0 else printer.extruder.target %}
    PAUSE_BASE
    # Rückfahrziel: Position zum Zeitpunkt von PAUSE_BASE (= Upstream
    # PAUSE_STATE; Jinja rendert vor dem Ausführen, dazwischen keine
    # Bewegung) bzw. CFS_RETURN_* (dann pause_rebase, s. _PI_PARAM)
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_x VALUE={rx}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_y VALUE={ry}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_z VALUE={rz}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_pos_valid VALUE={"xyz" in printer.toolhead.homed_axes}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_rebase VALUE={cfs}
    {% if cfs %}
      {action_respond_info("PAUSE nach abgebrochenem CFS-Wechsel: Fehlerposition X%.2f Y%.2f Z%.2f, Rückfahrziel für RESUME = Druckposition vor dem Wechsel X%.2f Y%.2f Z%.2f" % (gp.x, gp.y, gp.z, rx, ry, rz))}
    {% endif %}
    {% if ctemp > 0 %}
      {action_respond_info("PAUSE nach abgebrochenem CFS-Wechsel: RESUME heizt auf die Drucktemperatur vor dem Wechsel %.1f °C (aktuelles Ziel %.1f °C = Wechsel-Temperatur)" % (ctemp, printer.extruder.target|float))}
    {% endif %}
    {% if "k2_box" in printer %}
      # Z steckt im Rückfahrziel; alte Z-Korrektur einer früheren Pause weg
      KTWO_BOX_RESUME_FIX CLEAR=1
    {% endif %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set max_z = p.max_z_position|float %}
    {% set z_safe = 0.0 %}
    {% if act_z < 48.0 %}
      {% set z_safe = 50.0 - act_z %}
    {% elif act_z < max_z - 2.0 %}
      {% set z_safe = 2.0 %}
    {% elif act_z < max_z %}
      {% set z_safe = max_z - act_z %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=z_safe_pause VALUE={z_safe}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=hotend_temp VALUE={htemp}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=fan0_speed VALUE={printer['output_pin fan0'].value}
    SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=fan2_speed VALUE={printer['output_pin fan2'].value}
    M400
    {% if "xyz" in printer.toolhead.homed_axes %}
      {% if gp.x < pcx - 0.01 %}
        # Kopf am Schneidhebel (Abbruch im Schnitt): zuerst NUR X auf
        # pre_cut_pos_x (Stock box.cfg:13 "垂直撞刀", Schnitt-Rückweg G0 X10)
        G90
        G1 X{pcx} F{tv}
      {% endif %}
      G91
      {% if printer.extruder.can_extrude %}
        G1 E-1.0 F180
        G1 E-{p.pause_extrude} F360
      {% endif %}
      G1 Z{z_safe} F600
      G90
      {% if gp.y > sy + 0.5 %}
        # Kopf im Abfallschacht: wie KTWO_BOX_SAFE_POS (Stock box.cfg
        # T0-Beispiel 11: G0 X160 / G0 Y345) statt schräg heraus
        G1 X{crx} F{tv}
        G1 Y{sy} F{tv}
      {% endif %}
      G1 X{printer.toolhead.axis_maximum.x - 10} Y{printer.toolhead.axis_maximum.y / 2} F6000
    {% endif %}
    # wie Stock: Düse während der Pause auf 140 °C
    M104 S{p.g28_ext_temp}
    M107 P0
    M107 P2
    SET_PIN PIN=extruder_fan VALUE=0
  {% endif %}

[gcode_macro RESUME]
description: Druck fortsetzen: aufheizen, am Abfallschacht vordrucken, Düse reinigen, zurück zur Druckposition
rename_existing: RESUME_BASE
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% if "k2_box" in printer and printer.k2_box.chain_error %}
    {action_raise_error("RESUME gesperrt – CFS-Wechsel fehlgeschlagen: %s. Ursache beheben, KTWO_BOX_ERROR_CLEAR, Wechsel (T<n>) bzw. Schritt von Hand wiederholen, dann RESUME." % printer.k2_box.chain_error)}
  {% endif %}
  {% if printer.pause_resume.is_paused %}
    {% if "k2_box" in printer and printer.k2_box.change_aborted %}
      # Pause aus einem abgebrochenen CFS-Wechsel: Kopf-Filamentsensor
      # prüfen (leer -> Fehler, Druck bleibt pausiert) bzw. Wechsel
      # nachholen (resume_redo_change). Eigener Befehl VOR
      # _PI_RESUME_PREPARE (das rendert erst danach = Position nach dem
      # Nachholen). MOVE=1 nur, wenn _PI_RESUME_PREPARE danach fahren darf.
      {% set fr = printer["gcode_macro _PI_FREIGABE"] %}
      KTWO_BOX_RESUME_CHECK MOVE={1 if (fr.allow_move and "xyz" in printer.toolhead.homed_axes and p.pause_pos_valid) else 0}
    {% endif %}
    # Schacht -> M109 -> Vorextrusion -> Abkühlen -> Abstreifen -> Rückfahrt
    # (eigenes Makro: Temperatur/Position werden erst NACH M109 gelesen)
    _PI_RESUME_PREPARE
    # Lüfter wie vor der Pause (fan0 auch AUS, falls die Vorextrusion ihn
    # zum Abkühlen eingeschaltet hat)
    {% if p.fan0_speed > 0 %}
      SET_PIN PIN=fan0_en VALUE=1
      SET_PIN PIN=fan0 VALUE={(p.fan0_speed * 255)|round(1)}
    {% else %}
      M107 P0
    {% endif %}
    {% if p.fan2_speed > 0 %}
      SET_PIN PIN=fan2 VALUE={(p.fan2_speed * 255)|round(1)}
    {% endif %}
    SET_PIN PIN=extruder_fan VALUE=1
  {% endif %}
  # Upstream: RESTORE_GCODE_STATE NAME=PAUSE_STATE MOVE=1 (gerade Linie mit
  # recover_velocity) – nach _PI_RESUME_RETURN steht der Kopf schon dort.
  RESUME_BASE {rawparams}
  # Nach einer Pause mitten im CFS-Wechsel: Z-Hop des Wechsels zurücknehmen
  {% if "k2_box" in printer %}
    KTWO_BOX_RESUME_FIX
  {% endif %}

[gcode_macro _PI_RESUME_PREPARE]
description: RESUME-Vorbereitung (Stock RESUME_EXTERNAL): Schacht, Heizen, Vorextrusion, Reinigen, Rückfahrt
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set fr = printer["gcode_macro _PI_FREIGABE"] %}
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set cfg = printer.configfile.config %}
  {% set c = cfg["k2_box"] if "k2_box" in cfg else {} %}
  {% set pcx = (c.pre_cut_pos_x|default(10))|float %}
  # Schneidhebel-Zone: Stock-Prüfbereich des Anschlags check_cut_pos_x_min/
  # max (-9,5..-5,5, box.cfg:39-40) – dort kann keine Druckposition liegen
  {% set lever = (c.check_cut_pos_x_max|default(-5.5))|float %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set cut_now = "x" in homed and "y" in homed and pos.x < pcx - 0.01 %}
  {% set reason = "" %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {% set reason = "X/Y/Z nicht referenziert" %}
  {% elif not fr.allow_move %}
    {% set reason = "_PI_FREIGABE allow_move=False" %}
  {% elif kb is none %}
    {% set reason = "[k2_box] fehlt (Schacht-Positionen)" %}
  {% elif not kb.allow_move %}
    {% set reason = "[k2_box] allow_move=False" %}
  {% elif not p.pause_pos_valid %}
    {% set reason = "Pausenposition unbekannt (PAUSE ohne Referenz)" %}
  {% endif %}
  # Sperren VOR jeder Bewegung (auch vor M109):
  # Ziel am Schneidhebel -> RESUME_BASE führe gerade hinein
  {% if p.pause_pos_valid and p.pause_x|float <= lever %}
    {action_raise_error("RESUME gesperrt: Rückfahrziel X%.2f Y%.2f liegt am Schneidhebel (X <= check_cut_pos_x_max %.1f) – RESUME_BASE würde den Hebel erneut betätigen. Kopf/Druck von Hand prüfen, ggf. CANCEL_PRINT." % (p.pause_x|float, p.pause_y|float, lever))}
  {% endif %}
  # CFS-Abbruch (Ziel != PAUSE_STATE) oder Kopf am Schneidhebel: nur mit
  # eigener, sicherer Rückfahrt – RESUME_BASE allein führe gerade zur
  # Fehlerposition bzw. schräg aus dem Hebel
  {% if reason and (p.pause_rebase or cut_now) %}
    {action_raise_error("RESUME gesperrt: %s – die sichere Rückfahrt braucht Bewegung, aber: %s. Freigabe herstellen und RESUME wiederholen (Druck bleibt pausiert) oder CANCEL_PRINT." % (("Pause aus abgebrochenem CFS-Wechsel, Druckposition X%.2f Y%.2f Z%.2f" % (p.pause_x|float, p.pause_y|float, p.pause_z|float)) if p.pause_rebase else ("Kopf steht im Schneidbereich X%.2f (< pre_cut_pos_x %.1f)" % (pos.x, pcx)), reason))}
  {% endif %}
  {% if reason %}
    {action_respond_info("RESUME: Schacht/Vorextrusion/Reinigung übersprungen (%s) – nur Temperatur, Rückweg über RESUME_BASE." % reason)}
    {% if p.hotend_temp|int > 0 %}
      M109 S{p.hotend_temp|int}
    {% endif %}
  {% else %}
    SAVE_GCODE_STATE NAME=_pi_resume_prep
    {% if cut_now %}
      # Kopf am Schneidhebel (Abbruch in einer Pause): erst NUR X heraus
      {action_respond_info("RESUME: Kopf im Schneidbereich (X%.2f < %.1f) – zuerst nur X auf %.1f (Stock pre_cut_pos_x, Hebel senkrecht)" % (pos.x, pcx, pcx))}
      G90
      G1 X{pcx} F{p.resume_travel_speed}
      M400
    {% endif %}
    # in den Schacht (Tropfen beim Aufheizen fallen dort hinein)
    _PI_NOZZLE_CLEAN ONLY=GO WHY=RESUME
    {% if p.hotend_temp|int > 0 %}
      M109 S{p.hotend_temp|int}
    {% endif %}
    _PI_RESUME_PRIME
    _PI_NOZZLE_CLEAN WHY=RESUME
    _PI_RESUME_RETURN
    # G90/G91, Geschwindigkeit, E-Basis wie vorher (ohne Fahrt)
    RESTORE_GCODE_STATE NAME=_pi_resume_prep
    {% if p.pause_rebase %}
      # Kopf steht an der Druckposition vor dem Wechsel -> PAUSE_STATE dort
      _PI_RESUME_REBASE
    {% endif %}
  {% endif %}

# Vorextrusion (Stock RESUME_EXTERNAL: M106 S0, G1 E{PAUSE.extrude+80}
# F{remain_material_velocity*0.8}, M106 S127, G4 P3000). Nur wenn die Düse
# im Abfallschacht steht (nie über dem Bett) und heiß genug ist.
# Geschwindigkeit: printer.k2_box.prime_speed (> 0 nur mit [k2_box]
# material_database: vol/2,4·60·0,8 des Materials in der Düse, unbekannt
# 288), sonst _PI_PARAM resume_prime_speed (460).
[gcode_macro _PI_RESUME_PRIME]
description: RESUME-Vorextrusion im Abfallschacht (nur über _PI_RESUME_PREPARE)
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set kps = ((kb.prime_speed|default(0)) if kb is not none else 0)|float %}
  {% set speed = kps if kps > 0 else p.resume_prime_speed|float %}
  {% set cfg = printer.configfile.config %}
  {% set c = cfg["k2_box"] if "k2_box" in cfg else {} %}
  {% set ex = (c.extrude_pos_x|default(133))|float %}
  {% set ey = (c.extrude_pos_y|default(378))|float %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set t = printer.extruder.temperature|float %}
  {% set tmin = [p.resume_prime_min_temp|float, (printer.configfile.settings.extruder.min_extrude_temp|default(170))|float]|max %}
  {% set length = p.pause_extrude|float + p.resume_prime_extra|float %}
  {% if (pos.x - ex)|abs >= 0.5 or (pos.y - ey)|abs >= 0.5 %}
    {action_respond_info("RESUME: Vorextrusion übersprungen – Düse nicht im Abfallschacht (X%.2f Y%.2f statt X%.2f Y%.2f), nie über dem Bett." % (pos.x, pos.y, ex, ey))}
  {% elif not printer.extruder.can_extrude or t < tmin %}
    {action_respond_info("RESUME: Vorextrusion übersprungen – Düse %.1f °C < Mindesttemperatur %.1f °C, kein Extrudieren." % (t, tmin))}
  {% elif length <= 0 %}
    {action_respond_info("RESUME: Vorextrusion übersprungen (Länge 0)")}
  {% else %}
    {action_respond_info("RESUME: Vorextrusion %.1f mm mit F%.0f im Abfallschacht (%.1f °C)" % (length, speed, t))}
    M107 P0
    G91
    G1 E{length} F{speed}
    G90
    M106 P0 S{p.resume_cool_fan}
    G4 P{(p.resume_cool_dwell|float * 1000)|int}
  {% endif %}

# Rückfahrt zur Pausenposition: zuerst (falls nötig) auf mindestens
# Pausen-Z, dann X/Y in dieser Höhe, zuletzt Z senkrecht auf Pausen-Z –
# Z geht dabei nie unter das Objektniveau und nie schräg übers Objekt.
# Nach einem CFS-Abbruch ist die "Pausenposition" die Druckposition VOR dem
# Wechsel (PAUSE CFS_RETURN_*, pause_rebase). Schneidbereich (X <
# pre_cut_pos_x): nur reine X-Fahrten (hinaus wie hinein, Stock box.cfg:13);
# Ziel am Schneidhebel (X <= check_cut_pos_x_max) -> Fehler, keine Fahrt.
# Pausenposition im Schacht: Einfahrt wie KTWO_BOX_GO_EXTRUDE_POS
# (Y345 -> X139 -> Y -> X). Offener chain_error (CFS-Schritt der
# Vorbereitung gescheitert) -> Fehler, keine Rückfahrt, kein RESUME_BASE.
[gcode_macro _PI_RESUME_RETURN]
description: RESUME-Rückfahrt zur Pausenposition (X/Y in Pausenhöhe, dann Z)
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set cfg = printer.configfile.config %}
  {% set c = cfg["k2_box"] if "k2_box" in cfg else {} %}
  {% set kb = printer["k2_box"] if "k2_box" in printer else none %}
  {% set sy = (c.safe_pos_y|default(345))|float %}
  {% set enx = (c.extrude_entry_pos_x|default(139))|float %}
  {% set pcx = (c.pre_cut_pos_x|default(10))|float %}
  {% set lever = (c.check_cut_pos_x_max|default(-5.5))|float %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set px = p.pause_x|float %}
  {% set py = p.pause_y|float %}
  {% set pz = p.pause_z|float %}
  {% set zt = [pos.z, pz]|max %}
  {% set tv = p.resume_travel_speed|float %}
  {% set zv = p.resume_z_speed|float %}
  {% if kb is not none and kb.chain_error %}
    {action_raise_error("RESUME abgebrochen vor der Rückfahrt – CFS-Schritt der Vorbereitung fehlgeschlagen: %s. Ursache beheben, KTWO_BOX_ERROR_CLEAR, RESUME wiederholen." % kb.chain_error)}
  {% endif %}
  {% if px <= lever %}
    {action_raise_error("RESUME-Rückfahrt verweigert: Ziel X%.2f Y%.2f liegt am Schneidhebel (X <= %.1f) – keine Fahrt." % (px, py, lever))}
  {% endif %}
  {% if p.pause_rebase %}
    {action_respond_info("RESUME: zurück zur Druckposition vor dem abgebrochenen CFS-Wechsel X%.2f Y%.2f in Z%.2f, dann Z%.2f" % (px, py, zt, pz))}
  {% else %}
    {action_respond_info("RESUME: zurück zur Pausenposition X%.2f Y%.2f in Z%.2f, dann Z%.2f" % (px, py, zt, pz))}
  {% endif %}
  G90
  {% if pos.x < pcx - 0.01 %}
    # Kopf am Schneidhebel: erst NUR X heraus (in der aktuellen Höhe) + Halt
    G0 X{pcx} F{tv}
    M400
  {% endif %}
  {% if pos.z < zt %}
    G1 Z{zt} F{zv}
  {% endif %}
  {% if px < pcx - 0.01 %}
    # Ziel im Schneidbereich (Druck nahe der linken Bettkante): X/Y bis an
    # dessen Rand, hinein NUR in X
    G0 X{pcx} Y{py} F{tv}
    G0 X{px} F{tv}
  {% elif py > sy + 0.5 %}
    # L3: Pausenposition im Schacht (Y > Betriebsfenster 352) -> nur für
    # diese Einfahrt aufweiten, danach zurück (RESUME_BASE bewegt XY dort
    # nicht mehr; E-/Z-Fahrten prüft Upstream nur für bewegte Achsen)
    {% set wide = "k2_limits" in printer and (py > printer.k2_limits.y_max or px < printer.k2_limits.x_min) %}
    {% if wide %}
      KTWO_LIMITS_WIDE REASON=RESUME-Schacht
    {% endif %}
    G0 Y{sy} F{tv}
    G0 X{enx} F{tv}
    G0 Y{py} F{tv}
    G0 X{px} F{tv}
    {% if wide %}
      KTWO_LIMITS_RESTORE
    {% endif %}
  {% else %}
    G0 X{px} Y{py} F{tv}
  {% endif %}
  G1 Z{pz} F{zv}

# Nach CFS-Abbruch (pause_rebase): Kopf steht an der Druckposition vor dem
# Wechsel. Upstream-PAUSE_STATE hält aber die Fehlerposition -> hier ohne
# Fahrt neu speichern: RESTORE_GCODE_STATE NAME=PAUSE_STATE (Modus,
# Geschwindigkeit, Faktoren, Basis; E-Basis + seit der Pause geförderte
# Länge = Upstream e_diff) und SAVE_GCODE_STATE NAME=PAUSE_STATE an der
# aktuellen Position. RESUME_BASE (MOVE=1) fährt dann nicht mehr, G-Code-E
# = E bei der Pause. Steht der Kopf NICHT dort (±0,01 mm) -> Fehler,
# PAUSE_STATE bleibt, kein RESUME_BASE. Nur über _PI_RESUME_PREPARE.
[gcode_macro _PI_RESUME_REBASE]
description: Nach CFS-Abbruch PAUSE_STATE auf die erreichte Druckposition setzen (nur über _PI_RESUME_PREPARE)
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set pos = printer.gcode_move.gcode_position %}
  {% set d = [(pos.x - p.pause_x|float)|abs, (pos.y - p.pause_y|float)|abs, (pos.z - p.pause_z|float)|abs]|max %}
  {% if d > 0.01 %}
    {action_raise_error("RESUME abgebrochen: Kopf steht bei X%.3f Y%.3f Z%.3f, nicht an der Druckposition vor dem CFS-Wechsel X%.3f Y%.3f Z%.3f (Abweichung %.3f mm) – PAUSE_STATE unverändert, kein RESUME_BASE, Druck bleibt pausiert." % (pos.x, pos.y, pos.z, p.pause_x|float, p.pause_y|float, p.pause_z|float, d))}
  {% endif %}
  {action_respond_info("RESUME: PAUSE_STATE (Fehlerposition des CFS-Wechsels) auf die Druckposition X%.2f Y%.2f Z%.2f gesetzt – RESUME_BASE fährt nicht mehr" % (pos.x, pos.y, pos.z))}
  RESTORE_GCODE_STATE NAME=PAUSE_STATE
  SAVE_GCODE_STATE NAME=PAUSE_STATE
  SET_GCODE_VARIABLE MACRO=_PI_PARAM VARIABLE=pause_rebase VALUE=False

# Aufräumen nach Druckfehler ([virtual_sdcard] on_error_gcode)
[gcode_macro _PI_RESET_STATE]
description: Heizungen, Lüfter, Kammer und Pause-Zustand nach Fehler zurücksetzen
gcode:
  TURN_OFF_HEATERS FORCE=1
  M107
  M141 S0
  CLEAR_PAUSE
  # C4 (README-k2_box.md §17): Box-Druckzustand zurück wie
  # END_PRINT (0x0d [0f 01] + 0x0f [00]), sonst bliebe Auto-Preload aus +
  # Sperre an bis zum nächsten END_PRINT. Nur wenn KTWO_BOX_PRINT_START ihn
  # gesetzt hat (print_hold = Bus war da); Fehler meldet k2_box nur.
  {% if "k2_box" in printer and printer.k2_box.print_hold %}
    KTWO_BOX_PRINT_END
  {% endif %}

# Stock-Abbruch = Druckende (README-k2_box.md §17), das
# zweite Stock-END_PRINT bewusst nicht (C1). C3: END_PRINT CANCEL=1 entlädt
# auch bei offenem Wechsel-Fehler (wenn sicher); NACH CANCEL_PRINT_BASE (Druck
# beendet, keine Pause mehr) setzt KTWO_BOX_CANCEL_RESET chain_error/
# Abbruch-Merker zurück (= Stock BOX_END_PRINT clear_resume_tnn) – scheitert
# vorher etwas, bleibt die RESUME-Sperre stehen.
[gcode_macro CANCEL_PRINT]
description: Druck abbrechen
rename_existing: CANCEL_PRINT_BASE
gcode:
  END_PRINT CANCEL=1
  CANCEL_PRINT_BASE
  {% if "k2_box" in printer %}
    KTWO_BOX_CANCEL_RESET
  {% endif %}

# ---------------------------------------------------------------------
# Bedienschutz (23.10.2026): 22.10. abends brach ein Tippen auf „Heizungen
# aus“ in Mainsail (Handy) den Mehrfarbdruck ab („Extrude below minimum
# temp“). Während eines Drucks (printing/paused) schaltet TURN_OFF_HEATERS
# daher NICHT sofort ab, sondern erst nach dem Druckende (aufgeschoben,
# Prüfung alle 30 s) – sofort nur mit FORCE=1. Eigene Aufrufer im Druck
# (END_PRINT, _PI_RESET_STATE) übergeben FORCE=1. Slicer-Dateien rufen
# TURN_OFF_HEATERS nicht auf (Orca/Creality Print/eigener Generator geprüft),
# sie nutzen M104/M140 S0 – das bleibt unverändert (Mainsail-Temperaturfeld
# sendet SET_HEATER_TEMPERATURE, ebenfalls unverändert).
# ---------------------------------------------------------------------
[gcode_macro TURN_OFF_HEATERS]
description: Alle Heizungen aus (während eines Drucks erst nach dem Druckende; sofort mit FORCE=1)
rename_existing: TURN_OFF_HEATERS_BASE
variable_aufgeschoben: False
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] and not params.FORCE|default(0)|int %}
    SET_GCODE_VARIABLE MACRO=TURN_OFF_HEATERS VARIABLE=aufgeschoben VALUE=True
    UPDATE_DELAYED_GCODE ID=_PI_HEIZUNG_NACH_DRUCK_AUS DURATION=30
    {action_respond_info("TURN_OFF_HEATERS im Druck NICHT ausgeführt (Schutz gegen versehentliches Tippen) – die Heizungen gehen nach dem Druckende aus. Sofort aus: TURN_OFF_HEATERS FORCE=1 oder den Druck abbrechen.")}
  {% else %}
    SET_GCODE_VARIABLE MACRO=TURN_OFF_HEATERS VARIABLE=aufgeschoben VALUE=False
    TURN_OFF_HEATERS_BASE
  {% endif %}

[delayed_gcode _PI_HEIZUNG_NACH_DRUCK_AUS]
gcode:
  {% if printer["gcode_macro TURN_OFF_HEATERS"].aufgeschoben %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
      UPDATE_DELAYED_GCODE ID=_PI_HEIZUNG_NACH_DRUCK_AUS DURATION=30
    {% else %}
      SET_GCODE_VARIABLE MACRO=TURN_OFF_HEATERS VARIABLE=aufgeschoben VALUE=False
      TURN_OFF_HEATERS_BASE
      {action_respond_info("Aufgeschobenes TURN_OFF_HEATERS nach dem Druckende ausgeführt.")}
    {% endif %}
  {% endif %}

# ---------------------------------------------------------------------
# Wiedereinstieg ab Schicht (k2_resume.py, README-k2_resume.md): Datei
# <name>_ab_schicht_<n>.gcode erzeugen; Vorspann ruft die beiden
# _PI_WIEDEREINSTIEG-Makros (nicht verwechseln mit _PI_RESUME_* = RESUME aus
# einer Pause). Das Teil bleibt auf dem Bett.
# ---------------------------------------------------------------------
[gcode_macro PRINT_FROM_LAYER]
description: Abgebrochenen Druck ab einer Schicht fortsetzen, das Teil bleibt auf dem Bett (FILE=Datei, LAYER=Schicht oder auto, START=1 startet sofort)
gcode:
  {% if params.FILE is not defined %}
    {action_raise_error("PRINT_FROM_LAYER: FILE=<Dateiname> angeben (KTWO_RESUME_INFO FILE=... zeigt die Schichten)")}
  {% endif %}
  KTWO_RESUME_PREPARE {rawparams}

[gcode_macro _PI_WIEDEREINSTIEG_BOX_START]
description: Wiedereinstieg: CFS-Druckzustand wie START_PRINT
gcode:
  {% if "k2_box" in printer and printer.k2_box.change_enabled %}
    KTWO_BOX_PRINT_START
  {% elif "k2_box" in printer %}
    KTWO_BOX_CANCEL_RESET START=1
  {% endif %}

[gcode_macro _PI_WIEDEREINSTIEG_VORDRUCK]
description: Wiedereinstieg: am Abfallschacht vordrucken und abstreifen (E=mm)
gcode:
  {% set e = params.E|default(25)|float %}
  {% if "k2_box" in printer and printer.k2_box.allow_move %}
    KTWO_BOX_GO_EXTRUDE_POS
    M83
    G1 E{e} F300
    G1 E-0.8 F2400
    KTWO_BOX_WIPE
    KTWO_BOX_SAFE_POS
  {% else %}
    {action_respond_info("Wiedereinstieg: Abfallschacht nicht freigegeben ([k2_box] allow_move) – kein Vordrucken")}
  {% endif %}

# ---------------------------------------------------------------------
# Kalibrierung (Upstream-Befehle, Namen wie Stock)
# ---------------------------------------------------------------------
[gcode_macro G29]
description: Bett komplett neu vermessen: heizen, Bett gerade stellen, Düse reinigen, Mesh als Profil „default“ messen (danach SAVE_CONFIG)
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set bed = params.BED_TEMP|default(p.default_bed_temp)|float %}
  M104 S{p.g28_ext_temp}
  M140 S{bed}
  G28
  M190 S{bed}
  M109 S{p.g28_ext_temp}
  Z_TILT_ADJUST
  # Stock G29 (gcode_macro.cfg:1005-1015): NOZZLE_CLEAR ... NEXT_HOMEZ_NACCU
  # vor dem letzten G28 Z – hier Silikonstreifen (README.md §7.2)
  _PI_NOZZLE_CLEAN WHY=G29
  G28 Z
  BED_MESH_CALIBRATE PROFILE=default
  # Bett ganz nach unten (max_z − 5, Stock: Z 175): SAVE_CONFIG startet
  # Klipper neu, die Motoren werden stromlos und das schwere Bett treibt die
  # 8-mm-Spindeln rückwärts an – unten kann es kaum noch (und kaum schief)
  # absacken (Live 26.10.2026: vor jedem Neustart so geparkt -> G28 ok)
  G90
  G1 Z{p.max_z_position|float - 5} F1200
  TURN_OFF_HEATERS
  # Eigenes Meldungs-Makro statt action_respond_info: das würde schon beim
  # Rendern, also vor dem ersten Schritt, „fertig“ melden; RESPOND gibt es
  # ohne [respond] nicht (22.10.2026 beides beobachtet).
  _PI_MELDUNG MSG="G29 fertig – Profil default mit SAVE_CONFIG speichern (startet Klipper neu)."

[gcode_macro _PI_MELDUNG]
description: Meldung erst beim Ausführen ausgeben (MSG=...)
gcode:
  {action_respond_info(params.MSG|default(""))}

# PID-Kalibrierung für die Mainsail-Makroleiste (22.10.2026). Stock-NOZZLE_PID
# lief mit Bauteillüfter 100 % bei 230 °C – damit pendelte die Düse ohne
# Lüfter 218,6↔221,5 °C und M109 kam nie an (Klipper: |Δ| ≤ 1 °C UND
# ≤ 0,1 °C/s). Ohne Lüfter bei 220 °C: 17.015/1.436/50.407 – schwang aber
# ebenfalls ±2 °C (Periode ≈ 10 s), Stock 14.296/1.271/40.206 ±1,4 °C;
# ruhig (±0,5 °C) erst 10/0.8/40 (HEATER_STABILITY_TEST, SET_HEATER_PID). Die Makros
# speichern nicht selbst: SAVE_CONFIG startet Klipper neu, die Motoren werden
# stromlos und das Bett sackt ab.
[gcode_macro _PI_KEIN_DRUCK]
description: Bricht ab, wenn ein Druck läuft oder pausiert ist (WAS=...)
gcode:
  {% if printer.print_stats.state in ["printing", "paused"] %}
    {action_raise_error("%s: nicht während eines Drucks" % (params.WAS|default("Kalibrierung")))}
  {% endif %}

# PLA/PETG verkoken in der Düse oberhalb von ≈ 260 °C. Steckt Filament im Kopf,
# heizen die Kalibrier-Makros nur mit FILAMENT_OK=1 (Hochtemperatur-Filament
# geladen) so hoch.
[gcode_macro _PI_HOCHTEMP_PRUEFEN]
description: Bricht ab, wenn TEMP > 260 °C und Filament im Kopf steckt (FILAMENT_OK=1 übergeht)
gcode:
  {% set temp = params.TEMP|default(0)|float %}
  {% set fsn = "filament_switch_sensor filament_sensor" %}
  {% set voll = fsn in printer and printer[fsn].filament_detected %}
  {% if temp > 260 and voll and not params.FILAMENT_OK|default(0)|int %}
    {action_raise_error("%s: %.0f °C mit Filament im Kopf – PLA/PETG verkokt. Erst entladen oder FILAMENT_OK=1 (Hochtemperatur-Filament geladen)." % (params.WAS|default("Heizen"), temp))}
  {% endif %}

[gcode_macro NOZZLE_PID]
description: Temperaturregelung der Düse (PID) einmessen (TEMP=220); danach SAVE_CONFIG zum Speichern
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set fan = params.FAN|default(0)|int %}
  {% set hoch = params.HOCH|default(0)|int %}
  _PI_KEIN_DRUCK WAS=NOZZLE_PID
  _PI_HOCHTEMP_PRUEFEN WAS=NOZZLE_PID TEMP={temp} FILAMENT_OK={params.FILAMENT_OK|default(0)}
  {% if printer.toolhead.homed_axes == "xyz" and "k2_box" in printer %}
    # Filament tropft beim Heizen – über den Abfallschacht
    KTWO_BOX_GO_EXTRUDE_POS
  {% endif %}
  SET_PIN PIN=fan0 VALUE=0
  SET_PIN PIN=fan0_en VALUE=0
  SET_PIN PIN=fan1 VALUE=0
  SET_PIN PIN=fan2 VALUE=0
  {% if fan > 0 %}
    M106 P0 S{fan}
  {% endif %}
  PID_CALIBRATE HEATER=extruder TARGET={temp}
  M107 P0
  M104 S0
  {% if hoch %}
  _PI_MELDUNG MSG="NOZZLE_PID_HIGH fertig – Werte oben, noch NICHT aktiv. Erst prüfen: SET_HEATER_PID HEATER=extruder SET=HIGH KP=.. KI=.. KD=.. + HEATER_STABILITY_TEST TEMP={temp|int} (seit Klipper-Update 23.10.2026 mit korrigierter Ku-Formel – Werte sind nicht mehr doppelt so scharf). Speichern mit SAVE=1 + SAVE_CONFIG (Neustart, Bett sackt ab → Z_AXIS_CALIBRATION)."
  {% else %}
  _PI_MELDUNG MSG="NOZZLE_PID fertig – Werte oben, noch NICHT aktiv. Erst prüfen: SET_HEATER_PID HEATER=extruder KP=.. KI=.. KD=.. + HEATER_STABILITY_TEST (23.10.2026 mit korrigierter Klipper-Formel gemessen und übernommen: 9.773/0.931/25.654 – ruhiger als 10/0.8/40). Speichern mit SAVE=1 + SAVE_CONFIG (Neustart, Bett sackt ab → Z_AXIS_CALIBRATION)."
  {% endif %}

# Stock NOZZLE_PID_HIGH: PID_CALIBRATE 320 °C mit Bauteillüfter + sofort
# SAVE_CONFIG, Creality-Firmware schaltet ab high_temp_value 280 auf den
# zweiten Satz. Hier: [k2_heater_pid] high_temp/high_pid_* schaltet
# automatisch; gemessen wird ohne Lüfter, gespeichert erst nach Prüfung.
[gcode_macro NOZZLE_PID_HIGH]
description: Düsen-PID für hohe Temperaturen ab 280 °C einmessen (TEMP=300, nur mit leerer Düse)
gcode:
  NOZZLE_PID HOCH=1 TEMP={params.TEMP|default(300)} FAN={params.FAN|default(0)} FILAMENT_OK={params.FILAMENT_OK|default(0)}

[gcode_macro BEDPID]
description: Temperaturregelung des Betts (PID) einmessen (TEMP=100, dauert ca. 10 min); danach SAVE_CONFIG
gcode:
  {% set temp = params.TEMP|default(100)|float %}
  _PI_KEIN_DRUCK WAS=BEDPID
  PID_CALIBRATE HEATER=heater_bed TARGET={temp}
  M140 S0
  _PI_MELDUNG MSG="BEDPID fertig – Werte oben. SAVE_CONFIG speichert und startet Klipper neu (Bett sackt ab), danach Z_AXIS_CALIBRATION."

# Ein Klick statt SET_GCODE_VARIABLE (bis 25.10.2026 ALLOW_MOTION).
# Nur nötig, wenn homing.cfg _PI_FREIGABE variable_allow_move: False steht
# (Erst-Inbetriebnahme, install.sh --bewegung-gesperrt); die Laufzeit-
# Freigabe fällt beim Neustart auf den Wert aus homing.cfg zurück.
[gcode_macro ALLOW_MOTION]
description: Fahrbewegungen erlauben bis zum nächsten Neustart – nur nötig, wenn die Bewegung gesperrt ist (Erst-Inbetriebnahme)
gcode:
  SET_GCODE_VARIABLE MACRO=_PI_FREIGABE VARIABLE=allow_move VALUE=True
  _PI_MELDUNG MSG="Bewegung freigegeben (bis zum nächsten Neustart)."

# Kopf zur Reinigungsposition am Abfallschacht fahren und dort stehen lassen
# (25.10.2026): nur der Hinweg von _PI_NOZZLE_CLEAN (ONLY=GO), ohne Spülen und
# Abstreifen. Gleiche Freigaben wie die Reinigung (X/Y referenziert, Bewegung frei).
[gcode_macro PARK_AT_PURGE]
description: Kopf zur Reinigungsposition am Abfallschacht fahren und dort stehen lassen (ohne Spülen und Abstreifen)
gcode:
  _PI_NOZZLE_CLEAN ONLY=GO WHY=PARK_AT_PURGE

# Stock-Name Z_AXIS_CALIBRATION (bis 25.10.2026 Z_AXIS_CALIBRATION). Standard
# warm wie Stock: BED_TEMP = _PI_PARAM default_bed_temp; BED_TEMP=0 = kalt.
# BED_TEMP > 0 = warm (Bett auf Temperatur, Düse
# 140 °C, nach dem Ausrichten Düse am Silikon säubern, G28 Z, Heizungen aus;
# AUS=0 lässt sie an). Abschließendes G28 Z wie Stock (NEXT_HOMEZ_NACCU):
# Z_TILT_ADJUST verstellt Z, die Referenz kommt danach neu aus der Bettmitte.
[gcode_macro Z_AXIS_CALIBRATION]
description: Bett gerade stellen (beide Z-Seiten angleichen): Referenzfahrt, Z-Tilt, neue Z-Referenz. Warm mit BED_TEMP (Standard 50 °C), kalt mit BED_TEMP=0
gcode:
  {% set p = printer["gcode_macro _PI_PARAM"] %}
  {% set bed = params.BED_TEMP|default(p.default_bed_temp)|float %}
  _PI_KEIN_DRUCK WAS=Z_AXIS_CALIBRATION
  {% if bed > 0 %}
    M140 S{bed}
    M104 S{p.g28_ext_temp}
  {% endif %}
  G28
  {% if bed > 0 %}
    M190 S{bed}
    M109 S{p.g28_ext_temp}
  {% endif %}
  Z_TILT_ADJUST
  {% if bed > 0 %}
    _PI_NOZZLE_CLEAN WHY=Z_AXIS_CALIBRATION
  {% endif %}
  G28 Z
  {% if bed > 0 and params.AUS|default(1)|int %}
    TURN_OFF_HEATERS
  {% endif %}
  _PI_MELDUNG MSG="Z_AXIS_CALIBRATION fertig (G28 + Z_TILT_ADJUST + G28 Z{', warm' if bed > 0 else ''})."

# Stock-Name BELT_TENSION (gcode_macro.cfg): Riemen über die Spannmodule auf
# 140 N. Ablauf wie am 23.10.2026 live geprüft (PI-INBETRIEBNAHME 10.4/10.5):
# G28 X Y, Kopf auf die Stock-Safe-Pos X225/Y345 (von dort bleiben die
# Rüttel-FORCE_MOVEs von k2_belt in X 125–325 / Y 145–345 – OHNE Endschalter-
# schutz!), INFO → SET (Regelung + 2 Rüttel-Zyklen + M84) → TEST. Nach jeder
# Achse sind die Motoren aus, deshalb vor der zweiten Achse erneut G28 X Y.
[gcode_macro BELT_TENSION]
description: Riemen automatisch auf 140 N spannen (AXES=XY, X oder Y); der Kopf fährt nach hinten und rüttelt die Riemen 2× durch
gcode:
  {% set axes = params.AXES|default("XY")|upper %}
  _PI_KEIN_DRUCK WAS=BELT_TENSION
  {% if "z" in printer.toolhead.homed_axes %}
    # Bett ganz nach unten (max_z − 5): der Rüttel-Zyklus endet mit M84,
    # danach fiele das schwere Bett ungebremst (8-mm-Spindeln, s. INPUTSHAPER)
    G90
    G1 Z{printer["gcode_macro _PI_PARAM"].max_z_position|float - 5} F1200
  {% endif %}
  BED_MESH_CLEAR
  {% if "X" in axes %}
    G28 X Y
    _PI_RIEMEN_ACHSE MDL=mdlx
  {% endif %}
  {% if "Y" in axes %}
    G28 X Y
    _PI_RIEMEN_ACHSE MDL=mdly
  {% endif %}
  _PI_MELDUNG MSG="BELT_TENSION fertig – Werte oben (Sollbereich 119–161 N). Motoren sind aus; vor dem nächsten Druck referenziert START_PRINT neu."

[gcode_macro _PI_RIEMEN_ACHSE]
description: Eine Riemenachse spannen (MDL=mdlx|mdly), Kopf vorher auf X225/Y345
gcode:
  G90
  G1 X225 Y345 F6000
  M400
  KTWO_BELT_INFO MDL_NAME={params.MDL}
  KTWO_BELT_SET MDL_NAME={params.MDL}
  KTWO_BELT_TEST MDL_NAME={params.MDL}

# Stock-Name. Wirkt bis zum nächsten Neustart; danach gelten wieder die Werte
# aus [input_shaper] bzw. dem SAVE_CONFIG-Block (gemessen mit INPUTSHAPER).
[gcode_macro TUNOFFINPUTSHAPER]
description: Input Shaper (Schwingungsausgleich) ausschalten bis zum nächsten Neustart
gcode:
  SET_INPUT_SHAPER SHAPER_FREQ_X=0 SHAPER_FREQ_Y=0
  _PI_MELDUNG MSG="Input Shaper aus (bis zum nächsten Neustart)."

# Stock-Name INPUTSHAPER (gcode_macro.cfg): Resonanzmessung mit dem
# Beschleunigungssensor im Kopf ([k2_lis2dw], README-k2_lis2dw.md) und
# Input-Shaper-Empfehlung je Achse (Upstream SHAPER_CALIBRATE, Messpunkt aus
# [resonance_tester] probe_points = Bettmitte, Z 175; Sweep 20–120 Hz).
# Wie Stock: Filamentsensor während der Messung aus (die Schwingungen lösen
# ihn sonst aus), Referenzfahrt nur falls nötig. Anders als Stock
# (CXSAVE_CONFIG): gespeichert wird nur mit SPEICHERN=1, weil SAVE_CONFIG
# Klipper neu startet; ohne gelten die Werte bis zum nächsten Neustart.
# Bricht SHAPER_CALIBRATE ab, bleibt der Filamentsensor aus – nach dem
# Neustart ist er wieder an (Config).
# Nach der Messung fährt das Bett ganz nach unten (max_z − 5): die Messung
# endet auf Z 175, und ohne Motorstrom (SAVE_CONFIG/Neustart) treibt das
# schwere Bett die 8-mm-Spindeln rückwärts an und fällt ungebremst, ggf.
# einseitig, nach unten (live 26.10.2026; danach Schleppfehler Z/Z1 beim
# nächsten Antasten aus der Endlage). Unten geparkt kann es kaum noch fallen.
# (Bis 26.10.2026 abends fuhr das Makro auf Z 10 – das ist das Bett OBEN an
# der Düse, von dort fiele es am weitesten; korrigiert.)
[gcode_macro INPUTSHAPER]
description: Input Shaper messen: Kopf schwingt in X und Y (laut, je Achse ~1–2 min). ACHSE=X|Y (Standard beide), SPEICHERN=1 übernimmt die Werte (Klipper-Neustart)
gcode:
  {% set achse = params.ACHSE|default("")|upper %}
  {% if achse not in ["", "X", "Y"] %}
    {action_raise_error("INPUTSHAPER: ACHSE=%s ungültig (X, Y oder weglassen) – keine Bewegung" % achse)}
  {% endif %}
  _PI_KEIN_DRUCK WAS=INPUTSHAPER
  {% set sensor_an = printer["filament_switch_sensor filament_sensor"].enabled %}
  _PI_MELDUNG MSG="INPUTSHAPER: Referenzfahrt (falls nötig), Kopf zur Bettmitte (Z 175), dann Schwingungsmessung {achse or 'X und Y'} – laut, Drucker nicht berühren."
  SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0
  G90
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  M106 S0
  {% if achse %}
    SHAPER_CALIBRATE AXIS={achse}
  {% else %}
    SHAPER_CALIBRATE
  {% endif %}
  M400
  G90
  G1 Z{printer["gcode_macro _PI_PARAM"].max_z_position|float - 5} F1200
  M400
  {% if sensor_an %}
    SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1
  {% endif %}
  {% if params.SPEICHERN|default(0)|int == 1 %}
    _PI_MELDUNG MSG="INPUTSHAPER fertig – speichere (SAVE_CONFIG, Klipper startet neu)."
    SAVE_CONFIG
  {% else %}
    _PI_MELDUNG MSG="INPUTSHAPER fertig – die empfohlenen Werte gelten bis zum Neustart. Dauerhaft übernehmen: SAVE_CONFIG (startet Klipper neu)."
  {% endif %}

# Ruhetest: hält TEMP und meldet Min/Max über ZEIT Sekunden (alle 5 s eine
# Messung). Die Untermakros werden erst beim Ausführen gerendert und lesen
# deshalb jeweils die aktuelle Temperatur.
[gcode_macro HEATER_STABILITY_TEST]
description: Prüft, wie ruhig die Düsentemperatur bleibt: TEMP halten (220 °C) und Schwankung über ZEIT Sekunden (120) messen
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% set zeit = params.ZEIT|default(120)|int %}
  {% set n = [((zeit + 4) // 5)|int, 1]|max %}
  _PI_KEIN_DRUCK WAS=HEATER_STABILITY_TEST
  _PI_HOCHTEMP_PRUEFEN WAS=HEATER_STABILITY_TEST TEMP={temp} FILAMENT_OK={params.FILAMENT_OK|default(0)}
  {% if printer.toolhead.homed_axes == "xyz" and "k2_box" in printer %}
    KTWO_BOX_GO_EXTRUDE_POS
  {% endif %}
  M109 S{temp}
  SET_GCODE_VARIABLE MACRO=_PI_TEMP_MESSUNG VARIABLE=tmin VALUE=999
  SET_GCODE_VARIABLE MACRO=_PI_TEMP_MESSUNG VARIABLE=tmax VALUE=-999
  {% for i in range(n) %}
    G4 P5000
    _PI_TEMP_MESSUNG
  {% endfor %}
  _PI_TEMP_ERGEBNIS SOLL={temp} ZEIT={n * 5}
  {% if params.AUS|default(1)|int %}
    M104 S0
  {% endif %}

[gcode_macro _PI_TEMP_MESSUNG]
variable_tmin: 999
variable_tmax: -999
gcode:
  {% set t = printer.extruder.temperature|float %}
  {% if t < tmin %}SET_GCODE_VARIABLE MACRO=_PI_TEMP_MESSUNG VARIABLE=tmin VALUE={t}{% endif %}
  {% if t > tmax %}SET_GCODE_VARIABLE MACRO=_PI_TEMP_MESSUNG VARIABLE=tmax VALUE={t}{% endif %}

[gcode_macro _PI_TEMP_ERGEBNIS]
gcode:
  {% set m = printer["gcode_macro _PI_TEMP_MESSUNG"] %}
  {% set soll = params.SOLL|float %}
  {% set abw = [soll - m.tmin, m.tmax - soll]|max %}
  {action_respond_info("HEATER_STABILITY_TEST %s s bei %.0f °C: min %.2f / max %.2f °C, größte Abweichung %.2f °C – %s" % (params.ZEIT, soll, m.tmin, m.tmax, abw, "ruhig (≤ 1 °C)" if abw <= 1.0 else "UNRUHIG (> 1 °C, PID prüfen)"))}
