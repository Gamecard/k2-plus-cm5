# =====================================================================
# K2 Plus (F008) – Upstream-Klipper-Konfiguration für den Pi-CM5-Host
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET. Nur offline gegen
# Upstream-Klipper (Commit 9cb9975) im Batch-Modus geprüft (README.md §5).
#
# Grundlage: Stock-Configs des Druckers, Stand 16.10.2026 (printer.cfg +
# sensorless.cfg + printer_params.cfg +
# box.cfg + motor_control.cfg + gcode_macro.cfg).
# MCU-Firmware bleibt die ORIGINALE Creality-Firmware:
#   Main-MCU  GD32F303RET6 (gd32f303xe), 1.1.0.48-293-g493f9a0f
#   Düsen-MCU GD32F303CBT6 (gd32f303xb), 1.1.0.48-293-g493f9a0f
#
# SICHERHEIT: Was bewegt oder schreibt, ist per Default GESPERRT:
#   [k2_prtouch] allow_move: False, [k2_motor] allow_write: False,
#   [k2_box] allow_write/allow_move: False. AUSNAHMEN (Stand nach der
#   Inbetriebnahme 23.10.2026): homing.cfg _PI_FREIGABE allow_move: True,
#   [k2_belt mdlx/mdly] allow_write/allow_move: True. Erst-Inbetriebnahme:
#   install.sh --bewegung-gesperrt. Freigabe schrittweise laut README.md §4
#   bzw. SCHNELLSTART-K2-PLUS.md §5. install.sh übernimmt von Hand gesetzte
#   allow_*-Werte bei jedem weiteren Lauf (k2cfg.py KEEP_OPTIONS).
#
# Zuordnung Stock-Abschnitt -> dieser Datei: README.md §2.
# Alles mit ANNAHME ist nicht belegt.
# =====================================================================


# ---------------------------------------------------------------------
# MCUs (Serial-Pfade = PLATZHALTER, ANNAHME)
# ---------------------------------------------------------------------
# Stock: /dev/ttyS2 (Main) und /dev/ttyS3 (Düse) am T113, je 230400 8N1.
# Baudrate MUSS 230400 bleiben (MCU-Konstante SERIAL_BAUD=230400 im
# Dictionary). Welcher by-id-Port welche MCU ist, zeigt (nur lesend,
# Klipper vorher stoppen): ~/klippy-env/bin/python ./k2-identify.py
# im Paketordner; install.sh --main-serial auto trägt den Treffer ein.
#
# Variante B (aktuell, bestätigt 22.10.2026): Pi-UARTs direkt über das
#   FFC-Breakout am Bridge-Board-Stecker J14 (PI-ANSCHLUSS-LOWERBOARD.md §8,
#   PI-INBETRIEBNAHME.md 0.11): Main-MCU = Pi-UART4 /dev/ttyAMA4
#   (dtoverlay=uart4-pi5), Düsen-MCU = Pi-UART2 /dev/ttyAMA2
#   (dtoverlay=uart2-pi5), je 230400. Eintragen z. B. mit
#   install.sh --main-serial /dev/ttyAMA4 --duese-serial /dev/ttyAMA2.
# Variante A (Rückfallweg, PI-INBETRIEBNAHME.md Anhang E): Main-MCU über
#   RS232 an J22 Pin 10/4 via USB-RS232-Konverter (FTDI, by-id
#   usb-FTDI_...-if00-port0); Pin 12 (+5 V) NIE anschließen, KEIN 3,3-V-
#   TTL-Adapter an J22.
[mcu]
serial: /dev/serial/by-id/usb-ANNAHME_USB-UART_Main-MCU-if00-port0
baud: 230400
restart_method: command

# Düsen-MCU (GD32F303CBT6): Variante B Pi-UART2 /dev/ttyAMA2 (s. o.).
# Platzhalter bleibt, bis der Port eingetragen ist (k2-identify.py erkennt
# die MCU, install.sh --duese-serial).
[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-ANNAHME_USB-UART_Duesen-MCU-if00-port0
baud: 230400
restart_method: command

# ---------------------------------------------------------------------
# Kraftsensor-Düse = Probe (Upstream-[probe]-Ersatz, Modul k2_prtouch.py)
# Steht hier (nicht in k2-module.cfg), weil PROBE_CALIBRATE/SAVE_CONFIG
# z_offset in die Hauptdatei schreibt – Upstream verbietet SAVE_CONFIG-
# Werte für Abschnitte aus Include-Dateien.
# Stock-[prtouch_v3] -> README.md §2 (welche Optionen übernommen/entfallen).
# Die Position vor den Includes ist seit dem Modul-Fix 16.10.2026 NICHT mehr
# nötig (kein Modul hängt klippy/extras/ mehr vorn an sys.path, README §5.3
# Punkt 5) – sie bleibt nur, damit Kraftsensor und Motoren oben stehen.
# ---------------------------------------------------------------------
[k2_prtouch]
# Rückfall 'mode: steps' (Host stoppt): seit 17.10.2026 gleiche Arm-/Ruhetest-/
# Disarm-Reihenfolge wie hier, Mindestgeschwindigkeit gilt dann für
# probe_speed (README-k2_prtouch B.1/B.2; Kontaktkriterium = ANNAHME).
# Host-Kontaktkriterium nur für mode: steps (README-k2_prtouch B.3, ANNAHME):
# window = bisheriges Fenster-Kriterium (Default); cumulative = zusätzlich
# „Treppe“ über mehrere 0,02-mm-Schritte (Bezug = Stufe vor dem Anstieg).
#contact_criterion: window
#contact_steps: 2
#contact_step_min: 250
# Nur mode: steps (18.10.2026, Live-Abgleich, README-k2_prtouch B.4/B.5):
# Notgrenze 27500 (Stock-Kontaktspitzen live
# bis 21815, max 40000, muss > contact_thresh sein) + Schritt 0,01 mm
# (Kontaktschritt bei bis 2270 Counts/µm <= ~22700, ~17 % unter 27500).
# can_brk nur im Mesh (KTWO_PRTOUCH_MESH / PROBE_STEPS CONTEXT=mesh) wie Stock.
#step_mm: 0.01
#emergency_thresh: 27500
#can_brk_scope: mesh
# Heiß-Antastung (beide Modi, README-k2_prtouch B.6): nur eine
# Meldung beim Scharfschalten, wenn Düse > temp_nozzle_warn (140 =
# g28_ext_temp) + hot_probe_margin °C; nie Abbruch/Heizen.
#hot_probe_warn: True
#hot_probe_margin: 10
mode: probe
# GESPERRT bis KTWO_PRTOUCH_TEST_SWAP/READ/QUERY_PROBE erfolgreich (README §4)
allow_move: False
# Stock speed: 5 (harte Grenze im Modul: <= 5 mm/s). Untergrenze seit
# 17.10.2026: 2,5 mm/s bei Stock-Schwellen (ANNAHME: zu
# flacher Kraftanstieg löst nie aus) – gilt auch für PROBE_SPEED= und
# homing_speed/second_homing_speed in [stepper_z]. NICHT senken: live
# Reserve zum schwächsten Kontakt nur ×2,3.
speed: 5.0
lift_speed: 5.0
# Stock z_offset: 0 (Düse = Taster)
z_offset: 0.0
# Stock samples: 1, samples_result: average, samples_tolerance: 0.5,
# samples_tolerance_retries: 5
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.5
samples_tolerance_retries: 5
probe_max_travel_mm: 8.0
# Wartezeit nach dem Scharfschalten: Pflicht >= 1,5 × max(lmt_dead, 128)
# Samples × 1/1280 s = 0,15 s (Totzeit).
arm_settle_s: 0.2
swap_check: True
# Ruhetest: dif, Rohwert != -1/24 Bit/nicht konstant, Tickabstand 0,78 ms
# ±10 %, gefilterter Kanal max <= rest_filt_max_frac × min_hold (ANNAHMEN).
rest_check: True
rest_max_dif: 3000
#rest_filt_max_frac: 0.5
# Optionaler Sensor-Selbsttest KTWO_PRTOUCH_CHECK (Ersatz Stock-PRES_CHECK,
# apax-Strom, README-k2_prtouch A.10). Default AUS: dann weder
# config_prtouch_apax noch Befehl – Verhalten exakt wie vorher. AN: sendet
# config_prtouch_apax mit oid_estp = Stepper von [extruder] (MUSS auf
# nozzle_mcu liegen, sonst Config-Fehler – falsches oid_estp = MCU-Shutdown).
# Nur auf ausdrücklichen Aufruf (nicht in G28), nie bei scharfer Düse;
# Buslast ≈ 12,4 kB/s (≈ 54 % der Düsenleitung) während des Tests.
# Kriterium dif >= pres_check_hold 15000 ist ANNAHME (Stock pres_chk_hold).
# Vorschlag (NICHT aktiv): im Homing-Ablauf vor dem ersten Z-Antasten
#   KTWO_PRTOUCH_CHECK MACRO=_PI_NOZZLE_CLEAN   (wie Stock um BOX_NOZZLE_CLEAN)
#pres_check: False
#pres_check_hold: 15000
#pres_check_max_s: 15
#pres_check_duration_s: 3
#pres_check_extrude_max_mm: 5
#pres_check_extrude_speed: 4
#pres_check_min_temp: 170
main_mcu: mcu
nozzle_mcu: nozzle_mcu
# '^' = Pull-Up wie Stock-Endzustand. In der Creality-FW heißt pull_up=0
# Pull-DOWN (Stock '!PC7' wird erst durch das NACHFOLGENDE
# config_prtouch_step auf Pull-Up gesetzt; bei uns kommt es davor). Das
# Modul lehnt '!PC7' ohne '^' ab (README-k2_prtouch A.8).
step_swap_pin: ^!PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
# Antast-Parameter (Stock-Werte).
# Beim Laden geprüft: pres_cfg_regs 60/56/44,
# pres_tri_hold min != max (sonst nie Auslösung!), min >= 1000, add >= 0,
# pres_tri_fter[1] > 0 (Hochpass Pflicht), [2] in [0, 1],
# pres_ded_tkms >= 64 (Samples).
pres_cfg_regs: 60
pres_acq_tkms: 0.78125
pres_tri_fter: 5, 1, 0.8
pres_tri_hold: 4000, 10000, 500
pres_ded_tkms: 128.0
step_acq_tkms: 0.390625

# Module ab Modul-Fix 16.10.2026 abends (KTWO_*-Befehle, k2_motor 'pins'/
# Config-Callback, k2_485): Batch-Lauf F ohne Testpatches fehlerfrei
# (README.md §5).
[include k2-motor.cfg]
[include k2-module.cfg]
[include homing.cfg]
[include macros.cfg]
[include cutcal.cfg]
# A10 (17.10.2026): Dual-Z-Lichtschranken PA15/PA8 – aktiv nur LESEND
# ([gcode_button]); Ausrichtung [k2_zalign] auskommentiert + gesperrt
# (zalign.cfg, README.md §7.7).
[include zalign.cfg]

# [mcu rpi] + [bl24c16f] (Stock: Host-MCU /tmp/klipper_host_mcu + EEPROM
# an i2c.1 des T113 für Power-Loss) ENTFALLEN bewusst: Der EEPROM sitzt am
# Upper-Board, das der Pi ersetzt; ohne ihn braucht es keine Linux-Host-MCU
# (und kein eigenes Dictionary). Siehe README.md §2.

# ---------------------------------------------------------------------
# Kinematik
# ---------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 800
max_accel: 30000
# Stock: max_accel_to_decel: 30000 (= max_accel). Upstream kennt die Option
# nicht mehr; gleichwertig ist minimum_cruise_ratio: 0.0 (keine Begrenzung).
minimum_cruise_ratio: 0.0
square_corner_velocity: 10
max_z_velocity: 30
max_z_accel: 1000

# ---------------------------------------------------------------------
# Stepper (Pins/Werte 1:1 Stock). Alle Motoren sind Closed-loop-Treiber
# mit STEP/DIR-Eingang; Enable gemeinsam !PA9.
# X/Y: "Sensorless" = Stall-Ausgang des Motortreibers auf PB11/PB12
# (motor_control.cfg: motor_x_stall PB11, motor_y_stall PB12). Upstream
# sieht das als normalen Endstop. Voraussetzung: Stall-Mode 1
# (MOTOR_STALL_MODE DATA=1) – siehe homing.cfg, OFFEN.
# ---------------------------------------------------------------------
[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 352.5
# L3 (18.10.2026): Betriebsfenster wie Stock – X min = [box] cut_pos_x
# (CR:stepper.py:332-333/368-377; Pi [k2_box] cut_pos_x Default -7.80 =
# SAVE_CONFIG 16.10.2026). [k2_limits] zieht den Wert beim Start auf den
# aktuellen cut_pos_x nach und weitet für Schneid-Kalibrierung auf -10
# (Stock-Roh-Config, SET_LIMITS). Vorher: -10 (dauerhaft weit).
position_min: -7.8
position_max: 352.5
homing_speed: 100
homing_retract_dist: 10

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.2
position_min: -6.2
# L3: Stock-Betriebsfenster Y bis PRINTER_PARAM variable_max_y_position
# 352.0 (CR:stepper.py:326-328, Stock-gcode_macro.cfg).
# Schacht/Abstreifer (Y 374-378) nur mit [k2_limits] aufgeweitet (y_max_wide
# 400 = Stock-Roh-Config). Vorher: 400 (dauerhaft weit).
position_max: 352
homing_speed: 100
homing_retract_dist: 10

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
# Z-Endstop = Kraftsensor-Düse über [k2_prtouch] (registriert "probe";
# Stopp über !PC7 + trsync wie Stock).
endstop_pin: probe:z_virtual_endstop
position_min: -10
# L3: Stock-SET_Z_LIMIT nach jedem G28 Z (CR:extras/homing.py:425/442/452,
# Formel CR:extras/gcode_move.py:72-90): 360 - zmax_safe_pox_diff 10 +
# |fade_target| 0 (BED_MESH_CLEAR vor dem Z-Homing, CR:homing.py:407 ->
# CR:bed_mesh.py:199) + 0,2 = 350.2. Upstream setzt die Grenze beim G28 Z
# selbst aus position_max. Echter Weg Düse->Lichtschranke ~352,2
# (am Original-Drucker beobachtet). Vorher: 360 (Bett bis in den unteren Anschlag).
position_max: 350.2
# k2_prtouch lehnt G28 Z mit homing_speed/second_homing_speed außerhalb 2,5–5 mm/s ab
# (Untergrenze ANNAHME, README-k2_prtouch A.8).
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[stepper_z1]
step_pin: PB15
dir_pin: PA1
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
# Stock: endstop_pin: probe:z_virtual_endstop. Upstream: KEIN endstop_pin
# – Klipper hängt alle Z-Stepper an den Endstop von stepper_z
# (k2_prtouch nutzt dafür LookupZSteppers).

# Strapping (k2_motor setzt Dir/Step als digital_out vor dem Motor-
# Broadcast), geteilte Lüfter-/ADC-Pins und Endstop PC7 (zugleich
# prtouch-Swap) – 1:1 Stock-Liste. Korrektur 22.10.2026: das „PB1“ im
# Stock-multi_pin heater_fans ist der MAIN-Pin PB1 (Klipper liest jeden Pin
# der Liste einzeln, ohne Präfix = mcu; Main-PB1 = 2. Pin
# von heater_fans). Düsen-PB1 gehört nur [output_pin extruder_fan].
# L3 (18.10.2026): Fahrgrenzen wie Stock (pi-host/k2_limits.py,
# README-k2_limits.md). Enge Werte oben in [stepper_x/y/z]; hier nur die
# Aufweitung (Stock SET_LIMITS = Roh-Config X -10 / Y 400) für Schacht,
# Spülen, Wischen, Schneid-Kalibrierung – nur mit gehomtem X/Y, immer mit
# Rücksetzen (k2_box je Schritt im finally, Makros KTWO_LIMITS_RESTORE,
# automatisch bei jedem G-Code-Fehler/motor_off). Dazu: G-Code-Fahrten
# außerhalb des Drucks nie unter Z -2 (Stock cmd_G1, hier Ablehnung).
# Werte können nur enger, nicht weiter als Stock gesetzt werden.
# Druck-Schutz (18.10.2026, kein Stock-Vorbild): Orcas K2-Vorlage
# change_filament_gcode endet mit G1 Z{z_after_toolchange}; vor der ersten
# Schicht ist das 0 -> Düse auf Z0 übers Bett. Im Druck (print_stats
# printing, Z gehomt) wird G-Code-Z < print_min_z (vor SET_GCODE_OFFSET/G92)
# auf print_low_z_raise angehoben, eine Meldung je Druck. Pause: kein
# Eingriff, außer der Kopf steht gerade durch den Schutz angehoben.
[k2_limits]
x_min_wide: -10
y_max_wide: 400
x_min_from_cut_pos: True
z_guard: True
z_min_outside_print: -2
print_low_z_guard: True
print_min_z: 0.05
print_low_z_raise: 2.0

[duplicate_pin_override]
pins: PC5,PA0,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PB2,PB14,PB1

# ---------------------------------------------------------------------
# Extruder + Hotend (Düsen-MCU)
# ---------------------------------------------------------------------
[thermistor my_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
control: pid
pid_kp: 14.296
pid_ki: 1.271
pid_kd: 40.206
# Stock-Sonderoptionen (Creality) ENTFALLEN – Upstream kennt keinen
# zweiten PID-Satz:
#   high_temp_value: 280
#   pid_kp_high_temp: 16.443 / pid_ki_high_temp: 1.370 / pid_kd_high_temp: 49.329
# OFFEN: für Hochtemperatur-Filamente ggf. per Makro SET_HEATER_PID
# o.ä. umschalten oder einen Kompromiss-PID messen (PID_CALIBRATE).
# 22.10.2026 (HEATER_STABILITY_TEST 120 s bei 220 °C, Bauteillüfter AUS):
#   PID_CALIBRATE mit Lüfter 17.713/1.874/41.847 ±1,5 °C (M109 hing),
#   PID_CALIBRATE ohne Lüfter 17.015/1.436/50.407 ±2,0 °C (Periode ≈ 10 s),
#   Stock 14.296/1.271/40.206 ±1,4 °C, 10/0.8/40 ±0,5 °C -> im
#   SAVE_CONFIG-Block des Pi. PID_CALIBRATE (Ziegler-Nichols) ist für
#   dieses Hotend zu scharf.
# 23.10.2026: Ursache war ein Klipper-Fehler (Ku-Formel mit voller statt
#   halber Heizleistung, Upstream-Fix e761a2c76). Nach dem Update neu
#   gemessen: 9.773/0.931/25.654. Vergleich ab 180 °C (alt 10/0.8/40 ->
#   neu): Überschwinger 6,7 -> 5,9 °C, ±1 °C ab 50 -> 41 s, Halteband
#   0,42 -> 0,25 °C, Bauteillüfter 100 % 1,48 -> 1,65 °C -> neu im
#   SAVE_CONFIG-Block des Pi.
min_temp: -30
max_temp: 390

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

# SET_HEATER_PID HEATER= KP= KI= KD= [SET=NORMAL|HIGH] [SAVE=1]: PID-Werte
# ohne Neustart umstellen (k2_heater_pid.py, 22.10.2026) – zum Vergleichen mit
# HEATER_STABILITY_TEST.
[k2_heater_pid]
# Zweiter PID-Satz für hohe Temperaturen (Ersatz für Stock high_temp_value 280
# / pid_*_high_temp, das Upstream nicht kennt): ab Ziel >= high_temp schaltet
# ein Timer auf den Hochsatz, zurück unter high_temp - high_hysteresis (Ziel 0
# sofort). Ohne high_pid_* keine Umschaltung. Werte ERST MESSEN
# (NOZZLE_PID_HIGH), mit SET_HEATER_PID HEATER=extruder SET=HIGH KP= KI= KD=
# + HEATER_STABILITY_TEST TEMP=300 prüfen, dann mit SAVE=1 + SAVE_CONFIG speichern
# (landet im Autosave-Block – hier NICHT eintragen, sonst Konflikt).
#high_heater: extruder
#high_temp: 280
#high_hysteresis: 10
#high_pid_kp:
#high_pid_ki:
#high_pid_kd:

# ---------------------------------------------------------------------
# Heizbett
# ---------------------------------------------------------------------
[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 37
pid_ki: 0.18
pid_kd: 280
min_temp: -30
max_temp: 135

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# ---------------------------------------------------------------------
# Kammer (PTC-Heizung, Kammerlüfter, Kammer-NTC) – 1:1 Stock
# PC5 wird von drei Abschnitten als ADC gelesen (Stock identisch,
# duplicate_pin_override).
# ---------------------------------------------------------------------
[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
min_temp: -30
max_temp: 80

[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

# CFS-Box-Klima (Luft IN der Box, nicht das Filament): Temperatur + relative
# Luftfeuchte aus dem 0x0a-Polling von [k2_box] – kein zusätzlicher Bus-
# Verkehr (k2_cfs_sensor.py, 22.10.2026). [k2_cfs_sensor] registriert
# sensor_type k2_cfs und muss VOR dem temperature_sensor stehen. Ohne Box
# bzw. ohne [k2_box] startet Klipper trotzdem; der Sensor bleibt ohne Wert
# (Zustand: printer["k2_cfs_sensor"]). Mainsail zeigt die Feuchte über den
# Anzeige-Alias „aht10 cfs_box“ (kein AHT10-Chip). Kein Shutdown bei Werten
# außerhalb min/max – sie werden nur verworfen.
[k2_cfs_sensor]
#box_object: k2_box
#report_time:          (leer = poll_interval von [k2_box])
#max_age: 60

[temperature_sensor cfs_box]
sensor_type: k2_cfs
min_temp: -10
max_temp: 80

[temperature_fan chamber_fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 80
control: watermark
max_delta: 0.5
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

# PTC-Lüfter der Kammerheizung. Stock-Option `is_ptc_fan: 1` (Creality)
# ENTFÄLLT: Stock ließ den Lüfter nur mit 30 % und erst nach ≈6 s Heizen
# laufen (CR:extras/heater_fan.py:36-50). Upstream-heater_fan läuft VOLL,
# sobald chamber_heater ein Ziel > 0 hat (heater_fan.py: "if target_temp or
# temp > heater_temp") – also immer, wenn die PTC heizen darf (sicherer).
# heater_temp 100 (unerreichbar) verhindert nur den Nachlauf – wie Stock.
# enable_pin PB2 = auch [output_pin ptc_power]: Upstream-Fan schaltet PB2 mit
# dem Lüfter ab (Lüfter 0 -> PTC-Versorgung aus, Stock-Config identisch).
# Tacho (L6, 18.10.2026): PC6 = Stock [fan_feedback] fan0_pin "PTC Fan"
# (Stock-printer_params.cfg), Stock OHNE Pull-up
# ("PC6", kein ^) -> hier ebenso. Main-MCU kennt config_counter (Dictionary).
# tachometer_ppr 2 = Upstream-Default (ANNAHME, Stock prüft nur "Drehzahl 0";
# beeinflusst nur die rpm-Anzeige, nicht die Stillstandserkennung).
# Am Gerät prüfen: M141 S45 -> KTWO_CHAMBER_STATUS zeigt rpm deutlich > 100;
# liest der Tacho 0 trotz drehendem Lüfter -> Pull-up testen (^PC6).
# Überwachung/Bett-Vorrang/50-%-Anlauf: [k2_chamber] unten.
[heater_fan chamber_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
heater_temp: 100
fan_speed: 1.0
tachometer_pin: PC6
tachometer_ppr: 2

# ---------------------------------------------------------------------
# PTC-Kammerheizung absichern (Modul k2_chamber.py, README-k2_chamber.md;
# L6, Stock CR:extras/heaters.py:76-101,
# :277-287). Steht hier (nicht in k2-module.cfg), weil es zur Kammer gehört.
#  - PTC-Lüfter (Tacho oben) unter min_rpm länger als fan_fault_time bei
#    Ziel > 0 oder PWM > 0 -> Kammerheizung sofort aus + Meldung "!! ...".
#    heater_off (Default): Ziel 0 + Sperre bis KTWO_CHAMBER_RESET, der Druck
#    läuft weiter (Stock: M141 S0 + key519, Druck läuft weiter).
#    shutdown: Klipper-Shutdown (bricht den Druck ab).
#  - Bett-Vorrang: PTC-Leistung 0, solange Bett-Ziel > 0 und Bett mehr als
#    bed_tolerance darunter (Stock heater_bed_state==1, max_delta 2).
#  - 50-%-Anlauf: erste soft_start_time s jeder Heizphase soft_start_power.
# Befehle: KTWO_CHAMBER_STATUS, KTWO_CHAMBER_RESET, KTWO_CHAMBER_WAIT
# (von M191 benutzt, bricht bei Lüfterfehler ab statt endlos zu warten).
# ---------------------------------------------------------------------
[k2_chamber]
heater: chamber_heater
fan: heater_fan chamber_fan
bed_heater: heater_bed
fan_fault_time: 15
min_rpm: 100
fan_fault_action: heater_off
bed_priority: True
bed_tolerance: 2.0
soft_start_time: 60
soft_start_power: 0.5

# ---------------------------------------------------------------------
# Lüfter (1:1 Stock als output_pin, damit die Slicer-Makros M106/M107
# mit P0/P1/P2 wie bei Stock funktionieren, s. macros.cfg)
#   fan0 = Bauteillüfter (Düse, mit fan0_en), fan1 = Kammer/Abluft (PA0,
#   teilt den Pin mit temperature_fan chamber_fan – Stock identisch!),
#   fan2 = Seitenlüfter (PB4+PB3)
# ---------------------------------------------------------------------
# Stock: pins:nozzle_mcu:PB7,PB1 → Düse PB7 + MAIN PB1 (22.10.2026 korrigiert;
# vorher Düse PB1 = extruder_fan, der Main-Lüfter lief nie).
[multi_pin heater_fans]
pins: nozzle_mcu:PB7, PB1

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 50.0

[output_pin fan0_en]
pin: nozzle_mcu:PB6

[output_pin fan0]
pin: !nozzle_mcu:PB15
pwm: True
cycle_time: 0.01
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PA0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[multi_pin heater_fan2]
pins: PB4, PB3

[output_pin fan2]
pin: multi_pin:heater_fan2
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin extruder_fan]
pin: nozzle_mcu:PB1

# ---------------------------------------------------------------------
# Licht, Netz, PTC-Versorgung (1:1 Stock; Bedeutung PC9 "power" ANNAHME:
# Schaltausgang, Stock-Default 0)
# ---------------------------------------------------------------------
[multi_pin LED_pin]
pins: PB0, PA12

[output_pin LED]
pin: multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[output_pin power]
pin: PC9

[output_pin ptc_power]
pin: PB2
value: 1

# ---------------------------------------------------------------------
# Sensoren
# ---------------------------------------------------------------------
# Filamentsensor am Kopf (1:1 Pin). Stock: pause_on_runout true +
# runout_gcode "G0 E30 F600 (wenn heiß) + BOX_CHECK_MATERIAL_REFILL".
# Pi (A7, README.md §7.4): Upstream pausiert bei pause_on_runout VOR dem
# runout_gcode (filament_switch_sensor.py: send_pause_command + "PAUSE\n" +
# Vorlage) – darum True wie Stock. KTWO_BOX_RUNOUT lädt im Pausenzustand
# aus der CFS nach (Ersatz-Slot gleiches Material/Farbe) und setzt per
# RESUME fort; E30 macht es im Abfallschacht (nicht am Parkpunkt über dem
# Bett). Ohne [k2_box] runout_refill/allow_write/allow_move, ohne Ersatz
# oder bei Fehlern bleibt der Druck pausiert (= Upstream-Standard).
[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  KTWO_BOX_RUNOUT

# Externe Spule (19.10.2026, README-k2_box.md §18): Stock [filament_rack]
# not_pin !PA5 (Haupt-MCU) = Sensor am externen Spulenhalter; beim Aufsetzen
# einer Spule liest der Stock EINMAL den RFID-Leser 0x11 (0x11 [02], live
# beobachtet). Optional, standardmäßig AUS:
# zum Aktivieren die vier Zeilen einkommentieren UND in k2-module.cfg
# [k2_box] extern_rfid: True setzen. KTWO_EXTERN_RFID sendet nur den
# Lesebefehl 0x02 (Sendeschutz: an 0x11 nur 0x02/0x14) und überschreibt das
# gespeicherte externe Material (Material-ID + Farbe). Pegel wie Stock
# (!PA5 ohne Pull-up; ANNAHME, am Gerät mit QUERY_BUTTON prüfen).
#[gcode_button extern_spule]
#pin: !PA5
#press_gcode:
#  KTWO_EXTERN_RFID

# [temperature_sensor mcu_temp] (Stock: sensor_type temperature_mcu)
# ENTFÄLLT: Upstream-temperature_mcu kennt "gd32f303xe" nicht und bricht
# mit "MCU temperature not supported on gd32f303xe" ab (temperature_mcu.py
# config_unknown). OFFEN: ggf. mit eigener Kalibrierung nachrüsten.

# Beschleunigungssensor: [k2_lis2dw] = Stock-[lis2dw] fuer Upstream-Klipper
# (altes Creality-MCU-Protokoll, Modul pi-host/k2_lis2dw.py, README-k2_lis2dw.md).
# Pins/Takt/Achsen 1:1 Stock.
[k2_lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6
axes_map: x,z,y
#start_fifo_bypass: True   # False = Startablauf wie Creality-Host
# Die Duesen-Firmware liest je Timer genau 1 Sample (Disassembly 22.10.2026,
# README-k2_lis2dw §9): Lieferrate = 1/(read_rest_ms + ~0,1 ms). Stock
# (2,5 ms) ~385/s, hier ~625/s. Untergrenze 1,5 ms (sonst liest die
# Firmware den FIFO leer -> Doppel-Samples). bandwidth = Tiefpass ODR/n
# (2 = Stock 800 Hz, 4 = 400 Hz Alias-Schutz fuer ~625/s).
#read_rest_ms: 1.5
#bandwidth: 4

# Stock-Werte. Messmethode: Upstream-Default = Sweep (sweeping_period 1.2 s,
# bewusst beibehalten). Creality-Stock misst per Einzelfrequenzen – wer exakt
# die Stock-Methode will, ergänzt hier "sweeping_period: 0".
[resonance_tester]
accel_chip: k2_lis2dw
probe_points:
   175,175,175
min_freq: 20
max_freq: 120
accel_per_hz: 100

# ---------------------------------------------------------------------
# Nivellierung (1:1 Stock)
# ---------------------------------------------------------------------
[z_tilt]
z_positions:
    -15, 175
    375, 175
points:
    5, 175
    345, 175
speed: 300
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

[bed_mesh]
speed: 100
mesh_min: 5, 5
mesh_max: 345, 345
probe_count: 9, 9
mesh_pps: 2, 2
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 5
split_delta_z: 0.01
# Stock: move_check_distance: 1 – Upstream verlangt >= 3.0 (Config-Fehler),
# daher Minimum 3 (feinere Segmentprüfung nur bei Creality-Klipper).
move_check_distance: 3

# Werte aus dem Stock-SAVE_CONFIG (live kalibriert), s. Block unten.
[input_shaper]

# ---------------------------------------------------------------------
# Allgemeines
# ---------------------------------------------------------------------
# Wiedereinstieg ab Schicht nach einem Abbruch (k2_resume.py,
# README-k2_resume.md; Makro PRINT_FROM_LAYER, KTWO_RESUME_INFO/PREPARE).
[k2_resume]
#safe_margin: 10      # mm Fahrhöhe über dem höchsten gedruckten Punkt
#probe_margin: 50     # mm Abstand Antastpunkt/Kopf zum Gedruckten (MODE=probe)
#prime_mm: 25         # mm Vordrucken am Abfallschacht

[virtual_sdcard]
# Stock: /mnt/UDISK/printer_data/gcodes + forced_leveling: true (Creality)
# ANNAHME: Standard-Pfad einer Moonraker-Installation als Benutzer "pi".
path: ~/printer_data/gcodes
# Bei Druckfehler aufräumen (Upstream-Default nur TURN_OFF_HEATERS; ergänzt
# um Lüfter, Kammer, Pause-Zustand).
on_error_gcode: _PI_RESET_STATE

[gcode_arcs]
resolution: 0.012

[idle_timeout]
# Stock 1:1 (praktisch nie). ANNAHME Grund: Closed-loop-Motoren/Bett nicht
# stromlos schalten. Achtung: Heizungen werden dadurch NIE automatisch
# abgeschaltet – vor Dauerbetrieb bewusst entscheiden (README §6).
timeout: 99999999

# FORCE_MOVE/SET_KINEMATIC_POSITION (Stock: enable_force_move: true).
# Für die Inbetriebnahme nötig (k2_prtouch README A.6 Schritt 3).
[force_move]
enable_force_move: True

[pause_resume]

[exclude_object]

[display_status]

