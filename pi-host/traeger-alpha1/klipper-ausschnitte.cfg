# =====================================================================
# K2-CM5-Träger Alpha 1 – Klipper-Konfig-Änderungen gegenüber heute
# (CM5 auf Waveshare CM5-IO-BASE-B + Breakout + USB-RS485-Adapter)
# =====================================================================
# KEINE vollständige Konfig: nur die Abschnitte, die sich ändern.
# Von Hand in ~/printer_data/config übernehmen (README-traeger-alpha1.md,
# Schritt „Klipper-Konfig“). Pfade/Ports ohne Seriennummern.
# Alle Werte sind von test_traeger_config.py gegen den Schaltplan geprüft.


# ---------------------------------------------------------------------
# AUSSCHNITT 1 – printer.cfg: serielle Pfade der MCUs
# ---------------------------------------------------------------------
# HEUTE (IO-Board, live seit 22.10.2026): Main /dev/ttyAMA4, Düse
# /dev/ttyAMA2. TRÄGER: dieselben UARTs auf denselben GPIOs –
#   UART4 = GPIO12 TX / GPIO13 RX -> Puffer U12/U13 -> Breakout 30/32
#   UART2 = GPIO4 TX / GPIO5 RX   -> Puffer U10/U11 -> Breakout 26/28
# -> Pfade bleiben gleich. Steht in der Live-Konfig noch ein by-id-Pfad
#    (Repo-Stand: usb-ANNAHME_…), durch diese Zeilen ersetzen.
# Baud MUSS 230400 bleiben (MCU-Konstante SERIAL_BAUD).
[mcu]
serial: /dev/ttyAMA4
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/ttyAMA2
baud: 230400
restart_method: command


# ---------------------------------------------------------------------
# AUSSCHNITT 2 – k2-module.cfg: RS485 über UART0 statt USB-Adapter
# ---------------------------------------------------------------------
# HEUTE: serial: /dev/serial/by-id/usb-…-if00-port0 (USB-RS485-Adapter,
#        DE schaltet der Adapter selbst).
# TRÄGER: UART0 GPIO14/15 -> THVD1450 (U3), DE/~RE = GPIO17 = UART0-RTS.
#   config.txt: dtoverlay=uart0-pi5,rs485 -> Kernel schaltet DE
#   (high nur beim Senden). rs485_de: kernel lässt [k2_485] das beim
#   Öffnen prüfen und bei Bedarf per ioctl TIOCSRS485 setzen
#   (k2_485.py ab 24.10.2026; ältere k2_485.py kennen die Option NICHT
#   -> erst Module aktualisieren, sonst Config-Fehler).
[k2_485]
serial: /dev/ttyAMA0
baud: 230400
rs485_de: kernel
#warn_window: 600
#warn_timeouts: 30
#warn_crc_errors: 10
#warn_retries: 30


# ---------------------------------------------------------------------
# AUSSCHNITT 3 – printer.cfg: VORLAGE späteres CAN-Toolhead (AUS)
# ---------------------------------------------------------------------
# can0 = MCP2518FD (SPI0 CE0, nINT GPIO25, 40 MHz) -> SN65HVD230 ->
# J9b (JST GH: CANH, CANL, GND). 1 Mbit/s, txqueuelen 1024 (can0/).
# Toolhead-24-V NICHT vom Träger: direkt vom Netzteil mit eigener
# 5-A-Kabelsicherung. UUID ermitteln (Klipper gestoppt):
#   ~/klippy-env/bin/python ~/klipper/scripts/canbus_query.py can0
# Abschluss: JP_CAN_TERM (Träger) gesteckt + 120 Ω am Toolhead-Ende.
#[mcu toolhead]
#canbus_uuid: <uuid-aus-canbus_query>
#canbus_interface: can0
